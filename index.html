        const APP_VERSION = '3.4';

    <style>
        * {
            box-sizing: border-box;
        }
        
        html {
            overflow-y: scroll;
        }
        
        body {
            margin: 0;
            padding: 0;
        }
        
        /* Language Toggle Button */
        #langToggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(17, 34, 64, 0.95);
            border: 1px solid #4b5563;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        
        @media (min-width: 640px) {
            #langToggle {
                padding: 10px 18px;
                font-size: 13px;
                gap: 8px;
            }
        }
        
        #langToggle:hover {
            border-color: #ffd700;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.2);
        }
        
        #langToggle:active {
            transform: scale(0.96);
        }

        /* Language dropdown menu */
        .lang-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 220px;
            background: rgba(10, 18, 47, 0.98);
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            backdrop-filter: blur(16px);
            padding: 8px 0;
            z-index: 50;
            display: none;
        }
        .lang-menu.open {
            display: block;
        }
        .lang-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: background 0.15s ease;
        }
        .lang-option:hover {
            background: rgba(255,255,255,0.06);
        }
        .lang-option svg {
            width: 22px;
            height: 15px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .lang-option span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Tùy chỉnh thanh cuộn */
        .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #0a192f; }
        .table-container::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #ffd700; }

        .flag-icon {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 1px;
        }

        /* Hiệu ứng Avatar */
        .avatar-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        /* Custom Date Picker */
        .datepicker-wrapper {
            position: relative;
            display: inline-block;
        }
        .datepicker-input {
            background: transparent;
            color: white;
            font-size: 0.75rem;
            width: 100%;
            min-width: 90px;
            cursor: pointer;
            border: none;
            outline: none;
            caret-color: transparent;
            user-select: none;
        }
        .datepicker-input::placeholder { color: #6b7280; }
        .datepicker-popup {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 9999;
            background: #112240;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            min-width: 240px;
            max-width: calc(100vw - 32px);
        }
        /* Right-align the "to date" popup so it doesn't overflow right edge */
        #toDatePopup {
            left: auto;
            right: 0;
        }
        .datepicker-popup.open { display: block; }
        .dp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .dp-nav-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
        }
        .dp-nav-btn:hover { background: #1e3a5f; color: #ffd700; }
        .dp-month-year {
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .dp-month-year:hover { background: #1e3a5f; }
        .dp-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .dp-day-name {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: #6b7280;
            padding: 4px 0;
            text-transform: uppercase;
        }
        .dp-day {
            text-align: center;
            font-size: 12px;
            padding: 6px 2px;
            border-radius: 6px;
            cursor: pointer;
            color: #e5e7eb;
            transition: background 0.15s;
        }
        .dp-day:hover:not(.dp-day-empty):not(.dp-day-disabled) { background: #1e3a5f; color: #ffd700; }
        .dp-day-empty { cursor: default; }
        .dp-day-disabled { color: #374151; cursor: not-allowed; }
        .dp-day-today { color: #60a5fa; font-weight: 700; }
        .dp-day-selected { background: #ffd700 !important; color: #0a192f !important; font-weight: 700; border-radius: 6px; }
        .dp-year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .dp-year-item, .dp-month-item {
            text-align: center;
            font-size: 12px;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            color: #e5e7eb;
        }
        .dp-year-item:hover, .dp-month-item:hover { background: #1e3a5f; color: #ffd700; }
        .dp-year-item.selected, .dp-month-item.selected { background: #ffd700; color: #0a192f; font-weight: 700; }

        .sort-icon { font-size: 0.7rem; opacity: 0.3; margin-left: 4px; }
        .sorted-asc .sort-icon::after { content: '▲'; opacity: 1; color: #ffd700; }
        .sorted-desc .sort-icon::after { content: '▼'; opacity: 1; color: #ffd700; }
        .unsorted .sort-icon::after { content: '↕'; }

        /* Stock code clickable badge */
        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #60a5fa;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
            user-select: none;
        }
        .stock-badge:hover,
        tr:hover .stock-badge,
        tr.row-touched .stock-badge {
            color: #ffd700;
            background-color: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.3);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        /* Chart icon — hidden by default, shown on row hover/touch */
        .stock-badge .chart-icon {
            opacity: 0;
            transition: opacity 0.18s ease;
            flex-shrink: 0;
        }
        .stock-badge:hover .chart-icon,
        tr:hover .stock-badge .chart-icon,
        tr.row-touched .stock-badge .chart-icon {
            opacity: 1;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Company name tooltip */
        #company-tooltip {
            position: fixed;
            z-index: 99999;
            background: #1e3a5f;
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #f3f4f6;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: min(280px, calc(100vw - 24px));
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            word-break: break-word;
        }
        #company-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        /* Progress bar at bottom of tooltip */
        #company-tooltip::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 215, 0, 0.5);
            border-radius: 0 0 10px 10px;
            transform-origin: left;
            animation: none;
        }
        #company-tooltip.visible::after {
            animation: tooltip-drain 4s linear forwards;
        }
        @keyframes tooltip-drain {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* Company name cell — show pointer cursor */
        .company-name-cell {
            cursor: pointer;
        }
        .company-name-cell:hover {
            color: #e5e7eb;
        }

        /* Tab Navigation Styles */
        .tab-button {
            color: #9ca3af;
            background: transparent;
            border: none;
            cursor: pointer;
            user-select: none;
            position: relative;
            border-radius: 10px;
            margin: 0 1px;
        }
        /* Responsive tab padding & font size */
        .tab-btn-responsive {
            padding: 6px 10px;
            font-size: 11px;
            white-space: nowrap;
        }
        @media (min-width: 480px) {
            .tab-btn-responsive {
                padding: 8px 14px;
                font-size: 12px;
            }
        }
        @media (min-width: 640px) {
            .tab-btn-responsive {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
        /* Hide scrollbar on the tab wrapper */
        .tab-scroll-wrapper::-webkit-scrollbar { display: none; }
        .tab-button:hover {
            color: #fef9c3;
            background: rgba(255, 255, 255, 0.06);
        }
        .tab-button.active {
            color: #0a192f;
            background: #ffd700;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }
        /* Green tab (Stable Volatility) when active */
        #tab-stable.active {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        /* Red tab (High Volatility) when active */
        #tab-high.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }
        .tab-button:active {
            transform: scale(0.98);
        }

        /* Video play button on tab */
        .tab-video-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,215,0,0.15);
            border: 1px solid rgba(255,215,0,0.4);
            margin-left: 5px;
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .tab-video-btn:hover {
            background: rgba(255,215,0,0.35);
            border-color: #ffd700;
            transform: scale(1.1);
        }
        .tab-button.active .tab-video-btn {
            background: rgba(0,0,0,0.2);
            border-color: rgba(0,0,0,0.3);
        }

        /* Filter Popup Styles */
        #filterPopup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 10000;
            background: #112240;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            min-width: 320px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #filterPopup.open {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }
        #filterOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #filterOverlay.open {
            opacity: 1;
            pointer-events: all;
        }
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-section:last-child {
            margin-bottom: 0;
        }
        .filter-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 8px;
            transition: all 0.15s;
        }
        .filter-section-title:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .filter-section-title .expand-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }
        .filter-section-title.expanded .expand-icon {
            transform: rotate(180deg);
        }
        .filter-section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .filter-section-content.expanded {
            max-height: 400px;
            overflow-y: auto;
        }
        .filter-section-content.expanded::-webkit-scrollbar {
            width: 6px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-track {
            background: #0a192f;
            border-radius: 3px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .filter-search {
            width: 100%;
            background: #0a192f;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 8px 36px 8px 12px;
            color: white;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .filter-search:focus {
            outline: none;
            border-color: #ffd700;
        }
        .filter-search-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .filter-search-wrapper .filter-search {
            margin-bottom: 0;
        }
        .filter-search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }
        .filter-search-clear:hover {
            color: #e5e7eb;
        }
        .filter-search-clear.hidden {
            display: none;
        }
        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .filter-option:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .filter-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a192f;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .filter-option.selected .filter-checkbox {
            background: #ffd700;
            border-color: #ffd700;
        }
        .filter-checkbox svg {
            width: 12px;
            height: 12px;
            color: #0a192f;
            display: none;
        }
        .filter-option.selected .filter-checkbox svg {
            display: block;
        }
        .filter-label {
            font-size: 13px;
            color: #e5e7eb;
            flex: 1;
        }
        .filter-count {
            font-size: 11px;
            color: #9ca3af;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }
        .filter-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }
        .filter-btn-apply {
            background: #ffd700;
            color: #0a192f;
        }
        .filter-btn-apply:hover {
            background: #ffed4e;
            transform: scale(1.02);
        }
        .filter-btn-clear {
            background: #374151;
            color: white;
        }
        .filter-btn-clear:hover {
            background: #4b5563;
        }
        .filter-select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            margin-bottom: 12px;
            transition: all 0.15s;
        }
        .filter-select-all:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.4);
        }
        .filter-select-all .filter-label {
            font-weight: 600;
            color: #ffd700;
        }
        .filter-select-all.selected .filter-checkbox {
            background: #ffd700;
            border-color: #ffd700;
        }
        .filter-select-all.selected .filter-checkbox svg {
            display: block;
        }
    </style>

<body class="bg-fin-blue text-gray-200 font-sans antialiased">

    <!-- Company name tooltip -->
    <div id="company-tooltip"></div>

    <!-- ═══ Floating Video Player ═══════════════════════════════════════════ -->
    <div id="videoPlayerContainer" style="
        display: none;
        position: fixed;
        z-index: 99998;
        bottom: 80px;
        right: 24px;
        width: 220px;
        min-width: 160px;
        min-height: 120px;
        background: #0a192f;
        border: 1px solid #374151;
        border-radius: 14px;
        box-shadow: 0 24px 64px rgba(0,0,0,0.7);
        overflow: hidden;
        resize: both;
        user-select: none;
    ">
        <!-- Drag handle / title bar -->
        <div id="videoTitleBar" style="
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 12px; background: #112240;
            cursor: grab; border-bottom: 1px solid #1e3a5f;
        ">
            <span id="videoTitle" style="font-size:11px;font-weight:700;color:#ffffff;letter-spacing:0.3px;line-height:1.3;flex:1;min-width:0;"></span>

    <script>
        // ─── Custom Date Picker ───────────────────────────────────────────────────
        // Force GMT+7 (Vietnam timezone) for all date operations
        const GMT7_OFFSET = 7 * 60; // 7 hours in minutes
        
        function getGMT7Date() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt7 = new Date(utc + (GMT7_OFFSET * 60000));
            gmt7.setHours(0, 0, 0, 0);
            return gmt7;
        }
        
        function createGMT7Date(year, month, day) {
            // Create date in GMT+7
            const date = new Date(Date.UTC(year, month, day, -7, 0, 0)); // UTC time minus 7 hours = GMT+7 midnight
            return date;
        }
        
        function parseISOtoGMT7(iso) {
            // Parse YYYY-MM-DD as GMT+7 midnight
            const [y, m, d] = iso.split('-').map(Number);
            return createGMT7Date(y, m - 1, d);
        }
        
        let dpLocale = {};
        function syncDatepickerLocaleFromI18n() {
            if (!i18n) return;
            Object.keys(i18n).forEach(function (lang) {
                const d = i18n[lang].datepicker;
                if (d && d.months && d.days) {
                    dpLocale[lang] = { months: d.months, days: d.days };
                }
            });
        }

        // Each picker: { inputEl, popupEl, value (Date|null), viewYear, viewMonth, mode:'day'|'month'|'year', min, max, onChange }
        const pickers = {};

        function isoToDisplay(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }

        function dateToIso(d) {
            // Convert Date to YYYY-MM-DD in GMT+7
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const gmt7 = new Date(utc + (GMT7_OFFSET * 60000));
            const y = gmt7.getFullYear();
            const m = String(gmt7.getMonth() + 1).padStart(2, '0');
            const day = String(gmt7.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function createPicker(id, onChange) {
            const inputEl  = document.getElementById(id);
            const popupEl  = document.getElementById(id + 'Popup');
            const today = getGMT7Date();
            const picker   = { inputEl, popupEl, value: null, viewYear: today.getFullYear(), viewMonth: today.getMonth(), mode: 'day', min: null, max: null, onChange };
            pickers[id]    = picker;

            inputEl.addEventListener('click', (e) => { e.stopPropagation(); togglePicker(id); });
            inputEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(id); });
            popupEl.addEventListener('click', (e) => e.stopPropagation());
            return picker;
        }

        function togglePicker(id) {
            const picker = pickers[id];
            const isOpen = picker.popupEl.classList.contains('open');
            // Close all pickers first
            Object.keys(pickers).forEach(k => closePicker(k));
            if (!isOpen) {
                picker.mode = 'day';
                renderPicker(id);
                picker.popupEl.classList.add('open');
            }
        }

        function closePicker(id) {
            pickers[id].popupEl.classList.remove('open');
        }

        function renderPicker(id) {
            const picker = pickers[id];
            const loc    = dpLocale[state.lang];
            const { viewYear, viewMonth, value, min, max } = picker;

            if (picker.mode === 'year') {
                renderYearView(id, loc);
            } else if (picker.mode === 'month') {
                renderMonthView(id, loc);
            } else {
                renderDayView(id, loc);
            }
        }

        function renderDayView(id, loc) {
            const picker = pickers[id];
            const { viewYear, viewMonth, value, min, max } = picker;
            const minDate = min ? parseISOtoGMT7(min) : null;
            const maxDate = max ? parseISOtoGMT7(max) : null;
            const today   = getGMT7Date();

            // First day of month (adjust: Mon=0 ... Sun=6)
            const firstDay = createGMT7Date(viewYear, viewMonth, 1);
            let startDow = firstDay.getDay(); // 0=Sun
            startDow = (startDow === 0) ? 6 : startDow - 1; // Mon-based

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavMonth('${id}',-1)">&#8249;</button>
                <span class="dp-month-year" onclick="dpSetMode('${id}','month')">${loc.months[viewMonth]} ${viewYear}</span>
                <button class="dp-nav-btn" onclick="dpNavMonth('${id}',1)">&#8250;</button>
            </div>
            <div class="dp-grid">`;

            loc.days.forEach(d => { html += `<div class="dp-day-name">${d}</div>`; });

            for (let i = 0; i < startDow; i++) html += `<div class="dp-day dp-day-empty"></div>`;

            for (let d = 1; d <= daysInMonth; d++) {
                const thisDate = createGMT7Date(viewYear, viewMonth, d);
                const iso = dateToIso(thisDate);
                const isSelected = value && dateToIso(value) === iso;
                const isToday    = thisDate.getTime() === today.getTime();
                // Compare Date objects properly: disable if before minDate OR after maxDate
                const disabled   = (minDate && thisDate < minDate) || (maxDate && thisDate > maxDate);
                let cls = 'dp-day';
                if (disabled)   cls += ' dp-day-disabled';
                if (isToday)    cls += ' dp-day-today';
                if (isSelected) cls += ' dp-day-selected';
                const click = disabled ? '' : `onclick="dpSelectDay('${id}','${iso}')"`;
                html += `<div class="${cls}" ${click}>${d}</div>`;
            }

            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function renderMonthView(id, loc) {
            const picker = pickers[id];
            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavYear('${id}',-1)">&#8249;</button>
                <span class="dp-month-year" onclick="dpSetMode('${id}','year')">${picker.viewYear}</span>
                <button class="dp-nav-btn" onclick="dpNavYear('${id}',1)">&#8250;</button>
            </div><div class="dp-year-grid">`;
            loc.months.forEach((m, i) => {
                const sel = picker.value && picker.value.getMonth() === i && picker.value.getFullYear() === picker.viewYear ? 'selected' : '';
                html += `<div class="dp-month-item ${sel}" onclick="dpSelectMonth('${id}',${i})">${m}</div>`;
            });
            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function renderYearView(id, loc) {
            const picker = pickers[id];
            const base   = picker.viewYear - 6;
            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavYearPage('${id}',-12)">&#8249;</button>
                <span class="dp-month-year">${base} – ${base + 11}</span>
                <button class="dp-nav-btn" onclick="dpNavYearPage('${id}',12)">&#8250;</button>
            </div><div class="dp-year-grid">`;
            for (let y = base; y < base + 12; y++) {
                const sel = picker.value && picker.value.getFullYear() === y ? 'selected' : '';
                html += `<div class="dp-year-item ${sel}" onclick="dpSelectYear('${id}',${y})">${y}</div>`;
            }
            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function dpNavMonth(id, delta) {
            const p = pickers[id];
            let m = p.viewMonth + delta, y = p.viewYear;
            if (m < 0)  { m = 11; y--; }
            if (m > 11) { m = 0;  y++; }
            p.viewMonth = m; p.viewYear = y;
            renderPicker(id);
        }
        function dpNavYear(id, delta)     { pickers[id].viewYear += delta; renderPicker(id); }
        function dpNavYearPage(id, delta) { pickers[id].viewYear += delta; renderPicker(id); }
        function dpSetMode(id, mode)      { pickers[id].mode = mode; renderPicker(id); }

        function dpSelectYear(id, y) {
            pickers[id].viewYear = y;
            pickers[id].mode = 'month';
            renderPicker(id);
        }
        function dpSelectMonth(id, m) {
            pickers[id].viewMonth = m;
            pickers[id].mode = 'day';
            renderPicker(id);
        }
        function dpSelectDay(id, iso) {
            const p = pickers[id];
            p.value = parseISOtoGMT7(iso);
            p.inputEl.value = isoToDisplay(iso);
            closePicker(id);
            p.onChange(iso);
        }

        function setPickerValue(id, iso) {
            const p = pickers[id];
            if (!iso) return;
            p.value = parseISOtoGMT7(iso);
            p.viewYear  = p.value.getFullYear();
            p.viewMonth = p.value.getMonth();
            p.inputEl.value = isoToDisplay(iso);
        }

        function setPickerLimits(id, min, max) {
            pickers[id].min = min || null;
            pickers[id].max = max || null;
        }

        // Re-render open pickers when language changes (updates month/day names)
        function refreshOpenPickers() {
            Object.keys(pickers).forEach(id => {
                if (pickers[id].popupEl.classList.contains('open')) renderPicker(id);
            });
        }

        // Close pickers when clicking outside
        document.addEventListener('click', () => { Object.keys(pickers).forEach(id => closePicker(id)); });
        // ─────────────────────────────────────────────────────────────────────────

        const SUPABASE_URL = 'https://ifjxishcrzndbszmvpef.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmanhpc2hjcnpuZGJzem12cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjEwOTcsImV4cCI6MjA5MjkzNzA5N30.0rHs4AWTmRmN34WWdxBM2RsTMu1VQwfKDjve0W2yHEg';

        // Load translations from i18n.json
        let i18n = null;

        // DEFAULT_LANG — read synchronously from i18n.json before any state is initialized
        const DEFAULT_LANG = (() => {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'i18n.json', false); // synchronous

        async function loadTranslations() {
            try {

                if (data.lang) {

                }

                // Attach flag markup and language labels to translations so applyTranslations can use them consistently
                Object.keys(i18nLanguages).forEach(lang => {
                    const languageCode = i18nLanguages[lang];
                    if (i18n[languageCode]) {

                                if (i18nFlags[languageCode]) {

                        }
                        if (i18nLangShort[languageCode]) {
                            i18n[languageCode].lang.short = i18nLangShort[languageCode];
                        }
                    } else {
                        // Ensure unsupported languages do not break the UI by falling back to English or default translations.
                        i18n[languageCode] = i18n.en || i18n[DEFAULT_LANG] || {};
                        i18n[languageCode].lang = i18n[languageCode].lang || {};
                        if (i18nFlags[languageCode]) {
                            i18n[languageCode].lang.flag = i18nFlags[languageCode];
                        }
                        if (i18nLangShort[languageCode]) {
                            i18n[languageCode].lang.short = i18nLangShort[languageCode];
                        }
                    }
                });

                // Derive default language from i18n.json languages array
                // (DEFAULT_LANG is already set via sync XHR at startup; state objects
                //  are already initialized with the correct value)
                
                // Convert paging strings to functions
                Object.keys(i18n).forEach(lang => {
                    const pagingTemplate = i18n[lang].paging;
                    i18n[lang].paging = function(start, end, total) {
                        return pagingTemplate
                            .replace('{start}', start)
                            .replace('{end}', end)
                            .replace('{total}', total);
                    };
                });
                syncDatepickerLocaleFromI18n();
                
                console.log('Translations loaded successfully, default lang:', DEFAULT_LANG);
                applyTranslations(); // Apply translations after loading
            } catch (error) {

        }

        // Apply translations to elements with data attributes
        function applyTranslations(lang = DEFAULT_LANG) {
            if (!i18n) return;
            const translationRoot = i18n[lang] || i18n[DEFAULT_LANG] || i18n.en || {};

            // Apply data-text-key attributes
            document.querySelectorAll('[data-text-key]').forEach(el => {
                const key = el.getAttribute('data-text-key');
                const keys = key.split('.');
                let value = translationRoot;
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.textContent = value;
            });

            // Apply data-title-key attributes
            document.querySelectorAll('[data-title-key]').forEach(el => {
                const key = el.getAttribute('data-title-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('title', value);
            });

            // Apply data-placeholder-key attributes
            document.querySelectorAll('[data-placeholder-key]').forEach(el => {
                const key = el.getAttribute('data-placeholder-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('placeholder', value);
            });
            // Apply data-alt-key attributes
            document.querySelectorAll('[data-alt-key]').forEach(el => {
                const key = el.getAttribute('data-alt-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('alt', value);
            });

            const pg = i18n[lang].page;
            if (pg && pg.documentTitle) document.title = pg.documentTitle;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc && pg && pg.metaDescription) metaDesc.setAttribute('content', pg.metaDescription);
            document.documentElement.lang = lang;

            // Sync flag from i18nFlags or translation wrapper
            const flagEl = document.getElementById('langFlag');
            if (flagEl) {
                const flagMarkup = i18nFlags[lang] || i18n[lang]?.lang?.flag;
                if (flagMarkup) {
                    flagEl.innerHTML = flagMarkup;
                    // Set flag style
                    const svg = flagEl.querySelector('svg');
                    if (svg) {
                        svg.style.width = '22px';
                        svg.style.height = '15px';
                        svg.style.borderRadius = '2px';
                        svg.style.display = 'block';
                    }
                }
            }

            // Sync language short code
            const langTextEl = document.getElementById('langText');
            if (langTextEl) {
                const langShort = i18nLangShort[lang] || i18n[lang]?.lang?.short || lang.toUpperCase();
                langTextEl.textContent = langShort;
            }
        }

        // Load translations and then load JS files
        function loadScripts() {

                'coreview_stock.js',
                'coreview_macro.js',
                'coreview_stable.js',
                'coreview_high.js',
                'coreview_watchlist.js',
                'coreview_spotlight.js'
            ];

            return Promise.all(scripts.map(src => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src + '?v=' + CACHE_BUSTER;
                script.async = false; // Maintain execution order
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            })));
        }

                if (typeof updateTabLabels === 'function') updateTabLabels();
                // Note: setupLanguageToggle will be called after header is loaded (see fetch block)

        // Hàm dịch tên công ty - Using Lingva (Fast, privacy-focused Google Translate proxy)
        async function translateNames(names) {
            const list = Array.from(new Set(names.filter(n => n && !state.translatedNames[n])));
            if (list.length === 0) {
                console.log('✅ All company names already cached!');
                return;
            }

            console.log(`🌐 Translating ${list.length} company names using Lingva...`);

            // Translate in large batches of 20 for maximum speed
            const batchSize = 20;
            let newTranslations = 0;
            
            for (let i = 0; i < list.length; i += batchSize) {
                const batch = list.slice(i, i + batchSize);
                
                // Translate entire batch in parallel (no waiting)
                const promises = batch.map(async (name) => {
                    try {
                        const url = `https://lingva.ml/api/v1/vi/en/${encodeURIComponent(name)}`;
                        const res = await fetch(url);
                        const result = await res.json();
                        
                        if (result && result.translation) {
                            state.translatedNames[name] = result.translation;
                            newTranslations++;
                            return true;
                        } else {
                            state.translatedNames[name] = name;
                            return false;
                        }
                    } catch (e) {
                        state.translatedNames[name] = name;
                        return false;
                    }
                });
                
                // Wait for batch to complete
                await Promise.all(promises);
                
                // Progressive update: Save and re-render after each batch
                if (newTranslations > 0) {
                    saveTranslationCache();
                    if (state.lang !== DEFAULT_LANG) {
                        renderBody(); // Update UI immediately with new translations
                    }
                }
                
                console.log(`✓ Batch ${Math.floor(i / batchSize) + 1}: ${newTranslations} translations`);
            }
            
            console.log(`✅ Completed: ${newTranslations} company names translated!`);
        }

        // Normalize Vietnamese text for search (removes diacritics)
        function normalizeFilterText(text) {
            if (!text) return '';
            let s = text.toLowerCase();
            const map = {
                'à':'a','á':'a','ả':'a','ã':'a','ạ':'a',
                'ă':'a','ằ':'a','ắ':'a','ẳ':'a','ẵ':'a','ặ':'a',
                'â':'a','ầ':'a','ấ':'a','ẩ':'a','ẫ':'a','ậ':'a',
                'đ':'d',
                'è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e',
                'ê':'e','ề':'e','ế':'e','ể':'e','ễ':'e','ệ':'e',
                'ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i',
                'ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o',
                'ô':'o','ồ':'o','ố':'o','ổ':'o','ỗ':'o','ộ':'o',
                'ơ':'o','ờ':'o','ớ':'o','ở':'o','ỡ':'o','ợ':'o',
                'ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u',
                'ư':'u','ừ':'u','ứ':'u','ử':'u','ữ':'u','ự':'u',
                'ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y'
            };
            for (const [a, b] of Object.entries(map)) {
                s = s.replace(new RegExp(a, 'g'), b);
            }
            return s;
        }

        // Setup filter search functionality
        function setupFilterSearch(inputId, containerId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            
            if (!input || !container) return;
            
            input.addEventListener('input', (e) => {
                const raw = e.target.value;
                const query = normalizeFilterText(raw);
                const options = container.querySelectorAll('.filter-option');
                
                options.forEach(option => {
                    const label = normalizeFilterText(option.querySelector('.filter-label').textContent);
                    option.style.display = label.includes(query) ? 'flex' : 'none';
                });
            });
        }
        
        // Clear filter search input and show all options
        function clearFilterSearch(inputId, containerId, clearBtnId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            const clearBtn = document.getElementById(clearBtnId);
            
            if (input) input.value = '';
            if (clearBtn) clearBtn.classList.add('hidden');
            
            // Show all options
            if (container) {
                container.querySelectorAll('.filter-option').forEach(opt => {
                    opt.style.display = 'flex';
                });
            }
            
            // Refocus input
            if (input) input.focus();
        }

        // Toggle individual filter (async wrapper)
        async function toggleFilterAsync(tab, field, value) {
            // Check if currently "none selected" (__NONE__ marker)
            const isNoneSelected = filterState[tab][field].has('__NONE__');
            
            if (isNoneSelected) {
                // Currently none selected, user wants to check one item
                // Clear the __NONE__ marker and add only this item
                filterState[tab][field].clear();
                filterState[tab][field].add(value);
            } else {
                // Check if currently "all selected" (empty set without __NONE__)
                const isAllSelected = filterState[tab][field].size === 0;
                
                if (isAllSelected) {
                    // Currently all selected, user wants to uncheck one item
                    // We need to explicitly select all OTHER items
                    
                    // Get all available items based on field type
                    let allItems = [];
                    if (field === 'single_stock') {
                        allItems = await getUniqueStockCodes();
                    } else if (field === 'ma15') {
                        allItems = getMA15Categories().map(v => v.key);
                    } else if (field === 'industry') {
                        allItems = await getUniqueIndustries();
                    } else if (field === 'source_name') {
                        allItems = await getUniqueSources();
                    }
                    
                    // Add all items EXCEPT the one being unchecked
                    allItems.forEach(item => {
                        if (item !== value) {
                            filterState[tab][field].add(item);
                        }
                    });
                } else {
                    // Normal toggle behavior (some items selected)
                    if (filterState[tab][field].has(value)) {
                        filterState[tab][field].delete(value);
                        
                        // If no items left after delete, set to __NONE__ (nothing selected)
                        if (filterState[tab][field].size === 0) {
                            filterState[tab][field].add('__NONE__');
                        }
                    } else {
                        filterState[tab][field].add(value);
                        
                        // Check if ALL items are now selected
                        // Get all available items based on field type
                        let allItems = [];
                        if (field === 'single_stock') {
                            allItems = await getUniqueStockCodes();
                        } else if (field === 'ma15') {
                            allItems = getMA15Categories().map(v => v.key);
                        } else if (field === 'industry') {
                            allItems = await getUniqueIndustries();
                        } else if (field === 'source_name') {
                            allItems = await getUniqueSources();
                        }
                        
                        // If all items are now selected, clear the set to represent "all selected"
                        if (filterState[tab][field].size === allItems.length) {
                            const allSelected = allItems.every(item => filterState[tab][field].has(item));
                            if (allSelected) {
                                filterState[tab][field].clear();
                            }
                        }
                    }
                }
            }
            
            // Update UI in-place (preserves scroll position)
            updateFilterUIInPlace(tab, field);
        }
        
        // Update filter UI in-place without rebuilding - preserves scroll position
        function updateFilterUIInPlace(tab, field) {
            const t = i18n[state.lang].filter;
            const fieldMap = {
                'single_stock': 'Stock',
                'ma15': 'MA15',
                'industry': 'Industry',
                'source_name': 'Source'
            };
            const containerId = `filterOptions${fieldMap[field]}`;
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const fieldState = filterState[tab][field];
            const isNone = fieldState.has('__NONE__');
            const isAll = fieldState.size === 0 && !isNone;
            
            // Update each option checkbox
            const options = container.querySelectorAll('.filter-option');
            options.forEach(option => {
                const onclick = option.getAttribute('onclick') || '';
                // Extract value from onclick="toggleFilter('tab', 'field', 'VALUE')"
                const match = onclick.match(/toggleFilter\([^,]+,\s*[^,]+,\s*'([^']+)'\)/);
                if (!match) return;
                const itemValue = match[1];
                
                const isSelected = !isNone && (isAll || fieldState.has(itemValue));
                option.classList.toggle('selected', isSelected);
            });
            
            // Update "Select All" checkbox
            const sectionIdMap = {
                'single_stock': 'stock-code',
                'ma15': 'ma15',
                'industry': 'industry',
                'source_name': 'source'
            };
            const sectionContent = document.getElementById(`filter-section-${sectionIdMap[field]}`);
            if (sectionContent) {
                const selectAllEl = sectionContent.querySelector('.filter-select-all');
                if (selectAllEl) {
                    selectAllEl.classList.toggle('selected', isAll);
                }
            }
            
            // Update header count text
            const totalItems = container.querySelectorAll('.filter-option').length;
            const selectedCount = isNone ? 0 : (isAll ? totalItems : fieldState.size);
            const headerSpan = document.querySelector(`.filter-section-title[onclick*="${sectionIdMap[field]}"] span`);
            if (headerSpan) {
                const labelMap = {
                    'single_stock': t.stockCode,
                    'ma15': t.ma15,
                    'industry': t.industry,
                    'source_name': t.source
                };
                const label = labelMap[field];
                headerSpan.textContent = (selectedCount === totalItems)
                    ? `${label} (${totalItems})`
                    : `${label} (${selectedCount}/${totalItems})`;
            }
            
            // Update toggle button text (Select All / Clear All)
            const toggleBtn = document.querySelector('.filter-btn-clear');
            if (toggleBtn) {
                const allFieldsSelected = Object.keys(filterState[tab]).every(f =>
                    filterState[tab][f].size === 0 && !filterState[tab][f].has('__NONE__')
                );
                toggleBtn.textContent = allFieldsSelected ? t.clearAll : t.selectAllBtn;
            }
        }
        
        // Synchronous wrapper for onclick handlers
        function toggleFilter(tab, field, value) {
            toggleFilterAsync(tab, field, value).catch(err => {
                console.error('Error toggling filter:', err);
            });

        // Toggle select all
        function toggleSelectAll(field) {

                'single_stock': 'Stock',

                'industry': 'Industry',

            const currentSize = filterState[tab][field].size;
            const isAllSelected = currentSize === 0 || visibleOptions.every(opt => opt.classList.contains('selected'));
            
            if (isAllSelected) {
                filterState[tab][field].clear();
                filterState[tab][field].add('__NONE__');

        function clearFilters() {

                filterState[tab][field].add('__NONE__');

        // Select all filters (check all items)

            });

        // Toggle between Select All and Clear All
        function toggleSelectClearAll() {
            const tab = currentTab;
            
            // Check if any filter has __NONE__ (meaning nothing selected)
            const hasNoneSelected = Object.keys(filterState[tab]).some(field => 
                filterState[tab][field].has('__NONE__')
            );
            
            // Check if all filters are empty (meaning all selected)
            const allEmpty = Object.keys(filterState[tab]).every(field => 
                filterState[tab][field].size === 0
            );
            
            if (hasNoneSelected || !allEmpty) {

        // Get unique stock codes from current data
        async function getUniqueStockCodes() {
            try {
                // Determine which table to query based on current tab
                let tableName = 'hotnews';
                let dateRange = { from: state.fromDate, to: state.toDate };
                let additionalFilter = '';
                
                if (currentTab === 'stable') {
                    tableName = 'stable_volatility';
                    dateRange = { from: stateStable.fromDate, to: stateStable.toDate };
                } else if (currentTab === 'high') {
                    tableName = 'high_volatility';
                    dateRange = { from: stateHigh.fromDate, to: stateHigh.toDate };
                } else if (currentTab === 'watchlist') {
                    tableName = 'hotnews';
                    dateRange = { from: stateWatchlist.fromDateWatchlist, to: stateWatchlist.toDateWatchlist };
                    // Add default filter for watchlist: wyckoff_phase = Accumulation
                    additionalFilter = '&wyckoff_phase=eq.Accumulation';
                } else if (currentTab === 'spotlight') {
                    tableName = 'hotnews';
                    dateRange = { from: stateSpotlight.fromDateSpotlight, to: stateSpotlight.toDateSpotlight };
                    // Add default filter for spotlight: recommendation = HOLD or BUY
                    additionalFilter = '&or=(recommendation.eq.HOLD,recommendation.eq.BUY)';
                }
                
                const url = `${SUPABASE_URL}/rest/v1/${tableName}?select=single_stock&match_method=eq.TICKER&publish_time=gte.${dateRange.from}T00:00:00Z&publish_time=lte.${dateRange.to}T23:59:59Z${additionalFilter}&limit=1000`;
                const res = await fetch(url, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                const codes = [...new Set(data.map(d => d.single_stock).filter(Boolean))].sort();
                return codes;
            } catch (e) {
                console.error('Error fetching stock codes:', e);
                return [];
            }
        }

        // Get MA15 categories

        // Get unique industries from current data
        async function getUniqueIndustries() {
            try {
                // Determine which table to query based on current tab
                let tableName = 'hotnews';
                let dateRange = { from: state.fromDate, to: state.toDate };
                let additionalFilter = '';
                
                if (currentTab === 'stable') {
                    tableName = 'stable_volatility';
                    dateRange = { from: stateStable.fromDate, to: stateStable.toDate };
                } else if (currentTab === 'high') {
                    tableName = 'high_volatility';
                    dateRange = { from: stateHigh.fromDate, to: stateHigh.toDate };
                } else if (currentTab === 'watchlist') {
                    tableName = 'hotnews';
                    dateRange = { from: stateWatchlist.fromDateWatchlist, to: stateWatchlist.toDateWatchlist };
                    // Add default filter for watchlist: wyckoff_phase = Accumulation
                    additionalFilter = '&wyckoff_phase=eq.Accumulation';
                } else if (currentTab === 'spotlight') {
                    tableName = 'hotnews';
                    dateRange = { from: stateSpotlight.fromDateSpotlight, to: stateSpotlight.toDateSpotlight };
                    // Add default filter for spotlight: recommendation = HOLD or BUY
                    additionalFilter = '&or=(recommendation.eq.HOLD,recommendation.eq.BUY)';
                }
                
                const url = `${SUPABASE_URL}/rest/v1/${tableName}?select=industry_vn,industry_en&match_method=eq.TICKER&publish_time=gte.${dateRange.from}T00:00:00Z&publish_time=lte.${dateRange.to}T23:59:59Z${additionalFilter}&limit=1000`;
                const res = await fetch(url, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                
                // Create a map of Vietnamese to English industries
                const industryMap = {};
                data.forEach(d => {
                    if (d.industry_vn && d.industry_en) {
                        industryMap[d.industry_vn] = d.industry_en;
                    }
                });
                
                // Store the mapping globally for later use
                window.industryTranslations = industryMap;
                
                // Return unique Vietnamese industries (sorted)
                const industries = [...new Set(data.map(d => d.industry_vn).filter(Boolean))].sort();
                return industries;
            } catch (e) {
                console.error('Error fetching industries:', e);
                return [];
            }
        }

        // Get unique sources from ALL data (not filtered by date)
        async function getUniqueSources() {
            try {
                console.log('=== GET UNIQUE SOURCES ===');
                
                // Fetch all unique sources in batches to ensure we get everything
                const batchSize = 1000;
                let allSources = new Set();
                let offset = 0;
                let hasMore = true;
                
                while (hasMore) {
                    const url = `${SUPABASE_URL}/rest/v1/hotnews?select=source_name&match_method=eq.INDUSTRY&limit=${batchSize}&offset=${offset}`;
                    console.log(`Fetching batch ${Math.floor(offset / batchSize) + 1}, offset: ${offset}`);
                    
                    const res = await fetch(url, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    const data = await res.json();
                    console.log(`Fetched ${data.length} records`);
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        hasMore = false;
                        break;
                    }
                    
                    // Add sources to set
                    data.forEach(d => {
                        if (d.source_name) {
                            allSources.add(d.source_name);
                        }
                    });
                    
                    console.log(`Unique sources so far: ${allSources.size}`);
                    
                    // If we got fewer records than batchSize, we've reached the end
                    if (data.length < batchSize) {
                        hasMore = false;
                    } else {
                        offset += batchSize;
                    }
                }
                
                const sources = Array.from(allSources).sort();
                console.log('Total unique sources found:', sources.length);
                console.log('Sources list:', sources);
                
                return sources;
            } catch (e) {
                console.error('Error fetching sources:', e);
                return [];
            }
        }
        
        // Map source names to localized display names
        function getSourceDisplayName(sourceName, lang = DEFAULT_LANG) {

        // Toggle filter section collapse/expand
        function toggleFilterSection(sectionId) {
            const titleElement = document.querySelector(`.filter-section-title[onclick*="${sectionId}"]`);
            const contentElement = document.getElementById(`filter-section-${sectionId}`);
            
            if (!titleElement || !contentElement) return;
            
            // Toggle expanded class on both title and content
            titleElement.classList.toggle('expanded');
            contentElement.classList.toggle('expanded');
            
            // Save the state
            filterSectionState[sectionId] = contentElement.classList.contains('expanded');
        }
        
        // Restore expanded/collapsed state after rebuilding filter content
        function restoreFilterSectionStates() {
            Object.keys(filterSectionState).forEach(sectionId => {
                if (filterSectionState[sectionId]) {
                    const titleElement = document.querySelector(`.filter-section-title[onclick*="${sectionId}"]`);
                    const contentElement = document.getElementById(`filter-section-${sectionId}`);
                    
                    if (titleElement && contentElement) {
                        titleElement.classList.add('expanded');
                        contentElement.classList.add('expanded');
                    }
                }
            });
        }

        // Make functions globally accessible
        window.openFilterPopup = openFilterPopup;

        window.toggleFilter = toggleFilter;
        window.toggleSelectAll = toggleSelectAll;
        window.clearFilters = clearFilters;
        window.selectAllFilters = selectAllFilters;
        window.toggleSelectClearAll = toggleSelectClearAll;
        window.applyFilters = applyFilters;
        window.toggleFilterSection = toggleFilterSection;

            const filename = VIDEO_FILES[tab]?.[lang];
            if (!filename) return;

            const container = document.getElementById('videoPlayerContainer');
            const video = document.getElementById('videoIframe');
            const source = document.getElementById('videoSource');
            const title = document.getElementById('videoTitle');
            const fallback = document.getElementById('videoFallback');

            if (title) title.innerText = getI18nVideoTabTitle(tab, lang);

            const url = getVideoUrl(filename);

            // Load new source — start muted for autoplay compliance, unmute immediately after play starts
            if (fallback) fallback.style.display = 'none';
            video.style.display = 'block';
            video.muted = true;
            source.src = url;
            video.load();
            video.play().then(() => {
                // Autoplay succeeded — unmute now
                video.muted = false;
            }).catch(() => {
                // Autoplay blocked — keep muted, user can press play manually
            });

            // Also unmute on first user interaction
            video.addEventListener('click', () => { video.muted = false; }, { once: true });
            video.addEventListener('touchstart', () => { video.muted = false; }, { once: true });

            // Show fallback on error
            video.onerror = () => {
                if (fallback) fallback.style.display = 'flex';
                video.style.display = 'none';
            };

            container.style.display = 'block';
            videoState.tab = tab;
            videoState.open = true;
        }

        function closeVideoPlayer() {
            const container = document.getElementById('videoPlayerContainer');
            const video = document.getElementById('videoIframe');
            const source = document.getElementById('videoSource');
            video.pause();
            source.src = '';
            video.load();
            container.style.display = 'none';
            videoState.open = false;
            videoState.tab = null;
        }

        function pauseVideoPlayer() {
            const video = document.getElementById('videoIframe');
            if (videoState.open && video) video.pause();
        }

        function resumeVideoPlayer() {
            const video = document.getElementById('videoIframe');
            if (videoState.open && video) video.play().catch(() => {});
        }

        function toggleVideoMute() {
            const video = document.getElementById('videoIframe');
            if (!video) return;
            videoState.muted = !videoState.muted;
            video.muted = videoState.muted;
            const icon = document.getElementById('videoMuteIcon');
            if (videoState.muted) {
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <line x1="23" y1="9" x2="17" y2="15"></line>
                    <line x1="17" y1="9" x2="23" y2="15"></line>`;
            } else {
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
            }
        }

        // Drag logic
        (function() {
            let isDragging = false, startX, startY, origLeft, origBottom;

            document.addEventListener('DOMContentLoaded', () => {
                const bar = document.getElementById('videoTitleBar');
                const container = document.getElementById('videoPlayerContainer');
                if (!bar || !container) return;

                bar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('button')) return;
                    isDragging = true;
                    bar.style.cursor = 'grabbing';
                    startX = e.clientX;
                    startY = e.clientY;
                    const rect = container.getBoundingClientRect();
                    origLeft = rect.left;
                    origBottom = window.innerHeight - rect.bottom;
                    container.style.right = 'auto';
                    container.style.bottom = 'auto';
                    container.style.left = origLeft + 'px';
                    container.style.top = rect.top + 'px';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    const rect = container.getBoundingClientRect();
                    let newLeft = origLeft + dx;
                    let newTop = parseFloat(container.style.top) + (e.clientY - startY);
                    // Clamp to viewport
                    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - rect.width));
                    newTop  = Math.max(0, Math.min(newTop,  window.innerHeight - rect.height));
                    container.style.left = newLeft + 'px';
                    container.style.top  = newTop + 'px';
                    startX = e.clientX;
                    startY = e.clientY;
                    origLeft = newLeft;
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                    bar.style.cursor = 'grab';
                });
            });
        })();

        // ═══════════════════════════════════════════════════════════════════════════
        // Function to load core view based on tab
        function loadCoreView(tab) {
            currentTab = tab;
            const container = document.getElementById('coreview-container');
            
            // Update tab button states
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            // Use CACHE_BUSTER for Safari iOS compatibility
            const cacheBuster = '?v=' + CACHE_BUSTER;
            
            if (tab === 'stock') {
                fetch('coreview_stock.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        if (state.searchQuery) {
                            const el = document.getElementById('searchInput');
                            if (el) { el.value = state.searchQuery; toggleClearBtn('clearStockBtn', state.searchQuery); }
                        }
                        if (typeof initStockView === 'function') initStockView();
                        // Auto-open video on first visit
                        if (!videoAutoOpened.stock) {
                            videoAutoOpened.stock = true;
                            setTimeout(() => openVideoPlayer('stock'), 800);
                        }
                    })
                    .catch(error => console.error('Error loading stock view:', error));
            } else if (tab === 'macro') {
                fetch('coreview_macro.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        if (state.searchQueryMacro) {
                            const el = document.getElementById('searchInputMacro');
                            if (el) { el.value = state.searchQueryMacro; toggleClearBtn('clearMacroBtn', state.searchQueryMacro); }
                        }
                        if (typeof initMacroView === 'function') initMacroView();
                        // Auto-open video on first visit
                        if (!videoAutoOpened.macro) {
                            videoAutoOpened.macro = true;
                            setTimeout(() => openVideoPlayer('macro'), 800);
                        }
                    })
                    .catch(error => console.error('Error loading macro view:', error));
            } else if (tab === 'stable') {
                fetch('coreview_stable.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        // Restore search query before init
                        if (stateStable.searchQuery) {
                            const el = document.getElementById('searchInputStable');
                            if (el) { el.value = stateStable.searchQuery; toggleClearBtn('clearStableBtn', stateStable.searchQuery); }
                        }
                        if (typeof initStableView === 'function') initStableView();
                    })
                    .catch(error => console.error('Error loading stable view:', error));
            } else if (tab === 'high') {
                fetch('coreview_high.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        // Restore search query before init
                        if (stateHigh.searchQuery) {
                            const el = document.getElementById('searchInputHigh');
                            if (el) { el.value = stateHigh.searchQuery; toggleClearBtn('clearHighBtn', stateHigh.searchQuery); }
                        }
                        if (typeof initHighView === 'function') initHighView();
                    })
                    .catch(error => console.error('Error loading high view:', error));
            } else if (tab === 'watchlist') {
                fetch('coreview_watchlist.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        // Restore search query before init
                        if (stateWatchlist.searchQuery) {
                            const el = document.getElementById('searchInputWatchlist');
                            if (el) { el.value = stateWatchlist.searchQuery; toggleClearBtn('clearWatchlistBtn', stateWatchlist.searchQuery); }
                        }
                        if (typeof initWatchlistView === 'function') initWatchlistView();
                    })
                    .catch(error => console.error('Error loading watchlist view:', error));
            } else if (tab === 'spotlight') {
                fetch('coreview_spotlight.html' + cacheBuster)
                    .then(response => response.text())
                    .then(data => {
                        container.innerHTML = data;
                        if (typeof applyTranslations === 'function') applyTranslations(state.lang || DEFAULT_LANG);
                        // Restore search query before init
                        if (stateSpotlight.searchQuery) {
                            const el = document.getElementById('searchInputSpotlight');
                            if (el) { el.value = stateSpotlight.searchQuery; toggleClearBtn('clearSpotlightBtn', stateSpotlight.searchQuery); }
                        }
                        if (typeof initSpotlightView === 'function') initSpotlightView();
                    })
                    .catch(error => console.error('Error loading spotlight view:', error));
            }
        }
        
        // Function to update tab labels
        function updateTabLabels() {
            const tabs = document.querySelectorAll('.tab-button .tab-text');
            // Update tab labels
            if (tabs[0]) tabs[0].innerText = i18n[state.lang].tabs.stock;
            if (tabs[1]) tabs[1].innerText = i18n[state.lang].tabs.macro;
            if (tabs[2]) tabs[2].innerText = i18n[state.lang].tabs.stable;
            if (tabs[3]) tabs[3].innerText = i18n[state.lang].tabs.high;
            if (tabs[4]) tabs[4].innerText = i18n[state.lang].tabs.watchlist;
            if (tabs[5]) tabs[5].innerText = i18n[state.lang].tabs.spotlight;
        }
        
        // Tab click handlers are enabled after DOM content loads.
        
        // Add tab click handlers
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tab-stock').addEventListener('click', () => loadCoreView('stock'));
            document.getElementById('tab-macro').addEventListener('click', () => loadCoreView('macro'));
            document.getElementById('tab-stable').addEventListener('click', () => loadCoreView('stable'));
            document.getElementById('tab-high').addEventListener('click', () => loadCoreView('high'));
            document.getElementById('tab-watchlist').addEventListener('click', () => loadCoreView('watchlist'));
            document.getElementById('tab-spotlight').addEventListener('click', () => loadCoreView('spotlight'));
        });
        
        // Load footer component
        fetch('footer.html?v=' + CACHE_BUSTER)
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
                applyTranslations(state.lang || DEFAULT_LANG);
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
