        function getTabQueryContext(tab) {
            const ctx = {
                tableName: 'hotnews',
                dateRange: { from: state.fromDate, to: state.toDate },
                searchQuery: state.searchQuery || '',
                extraQuery: ''
            };

            if (tab === 'stable') {
                ctx.tableName = 'stable_volatility';
                ctx.dateRange = { from: stateStable.fromDate, to: stateStable.toDate };
                ctx.searchQuery = stateStable.searchQuery || '';
            } else if (tab === 'high') {
                ctx.tableName = 'high_volatility';
                ctx.dateRange = { from: stateHigh.fromDate, to: stateHigh.toDate };
                ctx.searchQuery = stateHigh.searchQuery || '';
            } else if (tab === 'watchlist') {
                ctx.tableName = 'hotnews';
                ctx.dateRange = { from: stateWatchlist.fromDateWatchlist, to: stateWatchlist.toDateWatchlist };
                ctx.searchQuery = stateWatchlist.searchQuery || '';
                ctx.extraQuery = '&wyckoff_phase=eq.Accumulation';
            } else if (tab === 'spotlight') {
                ctx.tableName = 'hotnews';
                ctx.dateRange = { from: stateSpotlight.fromDateSpotlight, to: stateSpotlight.toDateSpotlight };
                ctx.searchQuery = stateSpotlight.searchQuery || '';
                ctx.extraQuery = '&or=(recommendation.eq.HOLD,recommendation.eq.BUY)';
            }

            return ctx;
        }

        function buildTabSearchQuery(tab) {
            const ctx = getTabQueryContext(tab);
            const query = (ctx.searchQuery || '').trim();
            if (!query) return '';

            const stockCodes = query.split(',').map(s => s.trim()).filter(Boolean);
            if (stockCodes.length === 1) {
                return `&single_stock=ilike.*${stockCodes[0]}*`;
            }
            return `&or=(${stockCodes.map(code => `single_stock.ilike.*${code}*`).join(',')})`;
        }

        function buildTabFilterQuery(tab, includeVolume = true, includePrice = true, treatNoneAsAll = false) {
            const filters = [];
            const tabFilterState = filterState[tab];
            if (!tabFilterState) return '';

            if (tabFilterState.single_stock.has('__NONE__') && !treatNoneAsAll) {
                filters.push('single_stock=eq.__IMPOSSIBLE__');
            } else if (tabFilterState.single_stock.size > 0) {
                const codes = Array.from(tabFilterState.single_stock);
                if (codes.length === 1) {
                    filters.push(`single_stock=eq.${codes[0]}`);
                } else {
                    filters.push(`or=(${codes.map(code => `single_stock.eq.${code}`).join(',')})`);
                }
            }

            if (tabFilterState.ma15.has('__NONE__') && !treatNoneAsAll) {
                filters.push('pct_ma15=eq.999999');
            } else if (tabFilterState.ma15.size > 0) {
                const ma15Filters = [];
                tabFilterState.ma15.forEach(key => {
                    if (key === '⏫ MA15') {
                        ma15Filters.push('pct_ma15.gt.5');
                    } else if (key === '⬆️ MA15') {
                        ma15Filters.push('and(pct_ma15.gt.1,pct_ma15.lte.5)');
                    } else if (key === '↔️ MA15') {
                        ma15Filters.push('and(pct_ma15.gte.-1,pct_ma15.lte.1)');
                    } else if (key === '⬇️ MA15') {
                        ma15Filters.push('and(pct_ma15.gte.-5,pct_ma15.lt.-1)');
                    } else if (key === '⏬ MA15') {
                        ma15Filters.push('pct_ma15.lt.-5');
                    }
                });
                if (ma15Filters.length > 0) {
                    filters.push(`or=(${ma15Filters.join(',')})`);
                }
            }

            if (tabFilterState.industry.has('__NONE__') && !treatNoneAsAll) {
                filters.push('industry_vn=eq.__IMPOSSIBLE__');
            } else if (tabFilterState.industry.size > 0) {
                const industries = Array.from(tabFilterState.industry).map(ind => encodeURIComponent(ind));
                if (industries.length === 1) {
                    filters.push(`industry_vn=eq.${industries[0]}`);
                } else {
                    filters.push(`or=(${industries.map(ind => `industry_vn.eq.${ind}`).join(',')})`);
                }
            }

            if (includeVolume && tabFilterState.volume && typeof tabFilterState.volume.min === 'number' && typeof tabFilterState.volume.max === 'number') {
                const minVolume = Math.floor(tabFilterState.volume.min * 1000000);
                const maxVolume = Math.ceil(tabFilterState.volume.max * 1000000);
                filters.push(`current_volume=gte.${minVolume}`);
                filters.push(`current_volume=lte.${maxVolume}`);
            }

            if (includePrice && tabFilterState.price && typeof tabFilterState.price.min === 'number' && typeof tabFilterState.price.max === 'number') {
                const minPrice = Math.floor(tabFilterState.price.min * 1000);
                const maxPrice = Math.ceil(tabFilterState.price.max * 1000);
                filters.push(`current_close=gte.${minPrice}`);
                filters.push(`current_close=lte.${maxPrice}`);
            }

            return filters.length > 0 ? '&' + filters.join('&') : '';
        }

        async function fetchVolumeBoundsForTab(tab) {
            const ctx = getTabQueryContext(tab);
            if (!ctx.dateRange.from || !ctx.dateRange.to) {
                return { min: 0, max: 0 };
            }

            // Build filter query but sanitize any __NONE__ or __IMPOSSIBLE__ fragments
            const rawFilter = `${ctx.extraQuery}${buildTabSearchQuery(tab)}${buildTabFilterQuery(tab, false, true)}`;
            console.debug('fetchVolumeBoundsForTab: rawFilter', rawFilter);
            const sanitizedFilter = rawFilter.replace(/(&|^)\w+=[^&]*(__NONE__|__IMPOSSIBLE__)/g, '');
            console.debug('fetchVolumeBoundsForTab: sanitizedFilter', sanitizedFilter);
            const url = `${SUPABASE_URL}/rest/v1/${ctx.tableName}?select=min(current_volume),max(current_volume)&match_method=eq.TICKER&publish_time=gte.${ctx.dateRange.from}T00:00:00%2B07:00:00&publish_time=lte.${ctx.dateRange.to}T23:59:59%2B07:00:00${sanitizedFilter}`;
            try {
                console.debug('fetchVolumeBoundsForTab: requesting URL', url);
                const res = await fetch(url, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                console.debug('fetchVolumeBoundsForTab: response status', res.status);
                const json = await res.json();
                console.debug('fetchVolumeBoundsForTab: response json', json);
                if (Array.isArray(json) && json.length > 0) {
                    const minValue = parseVolumeNumber(json[0].min);
                    const maxValue = parseVolumeNumber(json[0].max);
                    if (Number.isFinite(minValue) && Number.isFinite(maxValue)) {
                        const minMillion = Math.floor(minValue / 10000) / 100;
                        const maxMillion = Math.ceil(maxValue / 10000) / 100;
                        return {
                            min: Number(minMillion.toFixed(2)),
                            max: Number(maxMillion.toFixed(2))
                        };
                    }
                }

                console.warn('Volume bounds aggregate returned no valid values, falling back to row fetch for tab:', tab, 'rawFilter', rawFilter);
                return await fetchVolumeBoundsFromRows(tab);
            } catch (e) {
                console.error('Error fetching volume bounds:', e);
                return await fetchVolumeBoundsFromRows(tab);
            }
        }

        async function fetchVolumeBoundsFromRows(tab) {
            const ctx = getTabQueryContext(tab);
            if (!ctx.dateRange.from || !ctx.dateRange.to) {
                return { min: 0, max: 0 };
            }

            const batchSize = 1000;
            let offset = 0;
            let minValue = Infinity;
            let maxValue = -Infinity;
            let hasValue = false;

            while (true) {
                const rawFilter = `${ctx.extraQuery}${buildTabSearchQuery(tab)}${buildTabFilterQuery(tab, false, true)}`;
                const sanitizedFilter = rawFilter.replace(/(&|^)\w+=[^&]*(__NONE__|__IMPOSSIBLE__)/g, '');
                const url = `${SUPABASE_URL}/rest/v1/${ctx.tableName}?select=current_volume&match_method=eq.TICKER&publish_time=gte.${ctx.dateRange.from}T00:00:00%2B07:00:00&publish_time=lte.${ctx.dateRange.to}T23:59:59%2B07:00:00${sanitizedFilter}&limit=${batchSize}&offset=${offset}`;
                try {
                    console.debug('fetchVolumeBoundsFromRows: requesting URL', url);
                    const res = await fetch(url, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    console.debug('fetchVolumeBoundsFromRows: response status', res.status);
                    const json = await res.json();
                    console.debug('fetchVolumeBoundsFromRows: received', json && json.length ? `${json.length} rows` : json);
                    if (!Array.isArray(json) || json.length === 0) {
                        break;
                    }
                    json.forEach(row => {
                        const value = parseVolumeNumber(row.current_volume);
                        if (Number.isFinite(value)) {
                            hasValue = true;
                            minValue = Math.min(minValue, value);
                            maxValue = Math.max(maxValue, value);
                        }
                    });
                    if (json.length < batchSize) {
                        break;
                    }
                    offset += batchSize;
                } catch (e) {
                    console.error('Error fetching volume rows for fallback:', e);
                    break;
                }
            }

            if (!hasValue || minValue === Infinity || maxValue === -Infinity) {
                return { min: 0, max: 0 };
            }
            const minMillion = Math.floor(minValue / 10000) / 100;
            const maxMillion = Math.ceil(maxValue / 10000) / 100;
            return {
                min: Number(minMillion.toFixed(2)),

        async function fetchPriceBoundsForTab(tab) {
            const ctx = getTabQueryContext(tab);
            if (!ctx.dateRange.from || !ctx.dateRange.to) {
                return { min: 0, max: 0 };
            }

            const rawFilter = `${ctx.extraQuery}${buildTabSearchQuery(tab)}${buildTabFilterQuery(tab, true, false, true)}`;
            console.debug('fetchPriceBoundsForTab: rawFilter', rawFilter);
            const sanitizedFilter = rawFilter.replace(/(&|^)\w+=[^&]*(__NONE__|__IMPOSSIBLE__)/g, '');
            console.debug('fetchPriceBoundsForTab: sanitizedFilter', sanitizedFilter);
            const url = `${SUPABASE_URL}/rest/v1/${ctx.tableName}?select=min(current_close),max(current_close)&match_method=eq.TICKER&publish_time=gte.${ctx.dateRange.from}T00:00:00%2B07:00:00&publish_time=lte.${ctx.dateRange.to}T23:59:59%2B07:00:00${sanitizedFilter}`;

                console.debug('fetchPriceBoundsForTab: response status', res.status);

                if (Array.isArray(json) && json.length > 0) {
                    const minValue = parseVolumeNumber(json[0].min);

                    if (Number.isFinite(minValue) && Number.isFinite(maxValue)) {
                        const minThousands = Math.floor(minValue / 10) / 100;

                        return {
                            min: Number(minThousands.toFixed(2)),
                            max: Number(maxThousands.toFixed(2))
                        };
                    }
                }

                console.warn('Price bounds aggregate returned no valid values, falling back to row fetch for tab:', tab, 'rawFilter', rawFilter);
                return await fetchPriceBoundsFromRows(tab);
            } catch (e) {
                console.error('Error fetching price bounds:', e);
                return await fetchPriceBoundsFromRows(tab);
            }
        }

        async function fetchPriceBoundsFromRows(tab) {
            const ctx = getTabQueryContext(tab);
            if (!ctx.dateRange.from || !ctx.dateRange.to) {
                return { min: 0, max: 0 };
            }

            const batchSize = 1000;
            let offset = 0;
            let minValue = Infinity;
            let maxValue = -Infinity;
            let hasValue = false;

            while (true) {
                const rawFilter = `${ctx.extraQuery}${buildTabSearchQuery(tab)}${buildTabFilterQuery(tab, true, false, true)}`;
                const sanitizedFilter = rawFilter.replace(/(&|^)\w+=[^&]*(__NONE__|__IMPOSSIBLE__)/g, '');
                const url = `${SUPABASE_URL}/rest/v1/${ctx.tableName}?select=current_close&match_method=eq.TICKER&publish_time=gte.${ctx.dateRange.from}T00:00:00%2B07:00:00&publish_time=lte.${ctx.dateRange.to}T23:59:59%2B07:00:00${sanitizedFilter}&limit=${batchSize}&offset=${offset}`;
                try {
                    console.debug('fetchPriceBoundsFromRows: requesting URL', url);
                    const res = await fetch(url, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    console.debug('fetchPriceBoundsFromRows: response status', res.status);
                    const json = await res.json();
                    console.debug('fetchPriceBoundsFromRows: received', json && json.length ? `${json.length} rows` : json);
                    if (!Array.isArray(json) || json.length === 0) {
                        break;
                    }
                    json.forEach(row => {
                        const value = parseVolumeNumber(row.current_close);
                        if (Number.isFinite(value)) {
                            hasValue = true;
                            minValue = Math.min(minValue, value);
                            maxValue = Math.max(maxValue, value);
                        }
                    });
                    if (json.length < batchSize) {
                        break;
                    }
                    offset += batchSize;
                } catch (e) {
                    console.error('Error fetching price rows for fallback:', e);
                    break;
                }
            }

            if (!hasValue || minValue === Infinity || maxValue === -Infinity) {
                return { min: 0, max: 0 };
            }
            const minThousands = Math.floor(minValue / 10) / 100;
            const maxThousands = Math.ceil(maxValue / 10) / 100;
            return {
                min: Number(minThousands.toFixed(2)),
                max: Number(maxThousands.toFixed(2))
            };
        }

        function getPriceBoundsForTab(tab) {

            const dataMap = {

            if (values.length === 0) {

            }

            const min = Math.min(...values);
            const max = Math.max(...values);
            const minRounded = Math.floor(min * 100) / 100;
            const maxRounded = Math.ceil(max * 100) / 100;
            return {

                max: Number(maxRounded.toFixed(2))
            };
        }
        async function getUniqueSources() {
            try {
                console.log('=== GET UNIQUE SOURCES ===');
                
                // Fetch all unique sources in batches to ensure we get everything
                const batchSize = 1000;
                let allSources = new Set();
                let offset = 0;
                let hasMore = true;
                
                while (hasMore) {
                    const url = `${SUPABASE_URL}/rest/v1/hotnews?select=source_name&match_method=eq.INDUSTRY&limit=${batchSize}&offset=${offset}`;
                    console.log(`Fetching batch ${Math.floor(offset / batchSize) + 1}, offset: ${offset}`);
                    
                    const res = await fetch(url, {
                        headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                    });
                    const data = await res.json();
                    console.log(`Fetched ${data.length} records`);
                    
                    if (!Array.isArray(data) || data.length === 0) {
                        hasMore = false;
                        break;
                    }
                    
                    // Add sources to set
                    data.forEach(d => {
                        if (d.source_name) {
                            allSources.add(d.source_name);
                        }
                    });
                    
                    console.log(`Unique sources so far: ${allSources.size}`);
                    
                    // If we got fewer records than batchSize, we've reached the end
                    if (data.length < batchSize) {
                        hasMore = false;
                    } else {
                        offset += batchSize;
                    }
                }
                
                const sources = Array.from(allSources).sort();
                console.log('Total unique sources found:', sources.length);
                console.log('Sources list:', sources);
                
                return sources;
            } catch (e) {
                console.error('Error fetching sources:', e);
                return [];
            }
        }

        const VIDEO_BASE = 'https://github.com/tintucchungkhoan24h/hotnews/releases/latest/download';

        function getI18nVideoTabTitle(tab, lang) {
            if (!i18n || !i18n[lang] || !i18n[lang].video) return '';

        function openVideoPlayer(tab, event) {
            if (event) event.stopPropagation();
            const lang = state.lang || DEFAULT_LANG;
            const filename = i18nVideoFiles[tab]?.[lang];
            if (!filename) return;

            source.src = url;

        // Drag logic
        (function() {
            let isDragging = false, startX, startY, origLeft, origBottom;

            document.addEventListener('DOMContentLoaded', () => {
                const bar = document.getElementById('videoTitleBar');
                const container = document.getElementById('videoPlayerContainer');
                if (!bar || !container) return;

                bar.addEventListener('mousedown', (e) => {
                    if (e.target.closest('button')) return;
                    isDragging = true;
                    bar.style.cursor = 'grabbing';
                    startX = e.clientX;
                    startY = e.clientY;
                    const rect = container.getBoundingClientRect();
                    origLeft = rect.left;
                    origBottom = window.innerHeight - rect.bottom;
                    container.style.right = 'auto';
                    container.style.bottom = 'auto';
                    container.style.left = origLeft + 'px';
                    container.style.top = rect.top + 'px';
                    e.preventDefault();
                });

                document.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const dx = e.clientX - startX;
                    const dy = e.clientY - startY;
                    const rect = container.getBoundingClientRect();
                    let newLeft = origLeft + dx;
                    let newTop = parseFloat(container.style.top) + (e.clientY - startY);
                    // Clamp to viewport
                    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - rect.width));
                    newTop  = Math.max(0, Math.min(newTop,  window.innerHeight - rect.height));
                    container.style.left = newLeft + 'px';
                    container.style.top  = newTop + 'px';
                    startX = e.clientX;
                    startY = e.clientY;
                    origLeft = newLeft;
                });

                document.addEventListener('mouseup', () => {
                    isDragging = false;
                    bar.style.cursor = 'grab';
                });
            });
        })();

                        // Auto-open video on first visit
                        if (!videoAutoOpened.macro) {
                            videoAutoOpened.macro = true;

                    })
                    .catch(error => console.error('Error loading spotlight view:', error));
            }
        }
        
        // Function to update tab labels
        function updateTabLabels() {
            const tabs = document.querySelectorAll('.tab-button .tab-text');
            // Update tab labels
            if (tabs[0]) tabs[0].innerText = i18n[state.lang].tabs.stock;
            if (tabs[1]) tabs[1].innerText = i18n[state.lang].tabs.macro;
            if (tabs[2]) tabs[2].innerText = i18n[state.lang].tabs.stable;
            if (tabs[3]) tabs[3].innerText = i18n[state.lang].tabs.high;
            if (tabs[4]) tabs[4].innerText = i18n[state.lang].tabs.watchlist;
            if (tabs[5]) tabs[5].innerText = i18n[state.lang].tabs.spotlight;
        }
        
        // Tab click handlers are enabled after DOM content loads.
        
        // Add tab click handlers
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('tab-stock').addEventListener('click', () => loadCoreView('stock'));
            document.getElementById('tab-macro').addEventListener('click', () => loadCoreView('macro'));
            document.getElementById('tab-stable').addEventListener('click', () => loadCoreView('stable'));
            document.getElementById('tab-high').addEventListener('click', () => loadCoreView('high'));
            document.getElementById('tab-watchlist').addEventListener('click', () => loadCoreView('watchlist'));
            document.getElementById('tab-spotlight').addEventListener('click', () => loadCoreView('spotlight'));
        });
        
        // Load footer component
        fetch('footer.html?v=' + CACHE_BUSTER)
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-container').innerHTML = data;
                applyTranslations(state.lang || DEFAULT_LANG);
            })
            .catch(error => console.error('Error loading footer:', error));
