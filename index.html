    <style>
        * {
            box-sizing: border-box;
        }
        
        html {
            overflow-y: scroll;
        }
        
        body {
            margin: 0;
            padding: 0;
        }
        
        /* Language Toggle Button */
        #langToggle {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(17, 34, 64, 0.95);
            border: 1px solid #4b5563;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            white-space: nowrap;
        }
        
        @media (min-width: 640px) {
            #langToggle {
                padding: 10px 18px;
                font-size: 13px;
                gap: 8px;
            }
        }
        
        #langToggle:hover {
            border-color: #ffd700;
            box-shadow: 0 10px 40px rgba(255, 215, 0, 0.2);
        }
        
        #langToggle:active {
            transform: scale(0.96);
        }

        /* Language dropdown menu */
        .lang-menu {
            position: absolute;
            top: calc(100% + 10px);
            right: 0;
            min-width: 220px;
            max-width: min(320px, calc(100vw - 24px));
            max-height: min(70vh, 360px);
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background: rgba(10, 18, 47, 0.98);
            border: 1px solid #334155;
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.55);
            backdrop-filter: blur(16px);
            padding: 8px 0;
            z-index: 10050;
            display: none;
        }
        .lang-menu.open {
            display: block;
        }
        .lang-option {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent;
            border: none;
            color: #f8fafc;
            padding: 10px 14px;
            cursor: pointer;
            font-size: 12px;
            text-align: left;
            transition: background 0.15s ease;
        }
        .lang-option:hover {
            background: rgba(255,255,255,0.06);
        }
        .lang-option svg {
            width: 22px;
            height: 15px;
            border-radius: 2px;
            flex-shrink: 0;
        }
        .lang-option span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        /* Tùy chỉnh thanh cuộn */
        .table-container::-webkit-scrollbar { height: 8px; width: 8px; }
        .table-container::-webkit-scrollbar-track { background: #0a192f; }
        .table-container::-webkit-scrollbar-thumb { background: #1e3a8a; border-radius: 4px; }
        .table-container::-webkit-scrollbar-thumb:hover { background: #ffd700; }

        .flag-icon {
            width: 20px;
            height: 14px;
            object-fit: cover;
            border-radius: 1px;
        }

        /* Hiệu ứng Avatar */
        .avatar-glow {
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            border: 2px solid rgba(255, 215, 0, 0.5);
        }

        /* Custom Date Picker */
        .datepicker-wrapper {
            position: relative;
            display: inline-block;
        }
        .datepicker-input {
            background: transparent;
            color: white;
            font-size: 0.75rem;
            width: 100%;
            min-width: 90px;
            cursor: pointer;
            border: none;
            outline: none;
            caret-color: transparent;
            user-select: none;
        }
        .datepicker-input::placeholder { color: #6b7280; }
        .datepicker-popup {
            display: none;
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            z-index: 9999;
            background: #112240;
            border: 1px solid #374151;
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            min-width: 240px;
            max-width: calc(100vw - 32px);
        }
        /* Right-align the "to date" popup so it doesn't overflow right edge */
        #toDatePopup {
            left: auto;
            right: 0;
        }
        .datepicker-popup.open { display: block; }
        .dp-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .dp-nav-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 16px;
            padding: 4px 8px;
            border-radius: 6px;
            line-height: 1;
        }
        .dp-nav-btn:hover { background: #1e3a5f; color: #ffd700; }
        .dp-month-year {
            font-size: 13px;
            font-weight: 700;
            color: #ffd700;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .dp-month-year:hover { background: #1e3a5f; }
        .dp-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }
        .dp-day-name {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: #6b7280;
            padding: 4px 0;
            text-transform: uppercase;
        }
        .dp-day {
            text-align: center;
            font-size: 12px;
            padding: 6px 2px;
            border-radius: 6px;
            cursor: pointer;
            color: #e5e7eb;
            transition: background 0.15s;
        }
        .dp-day:hover:not(.dp-day-empty):not(.dp-day-disabled) { background: #1e3a5f; color: #ffd700; }
        .dp-day-empty { cursor: default; }
        .dp-day-disabled { color: #374151; cursor: not-allowed; }
        .dp-day-today { color: #60a5fa; font-weight: 700; }
        .dp-day-selected { background: #ffd700 !important; color: #0a192f !important; font-weight: 700; border-radius: 6px; }
        .dp-year-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .dp-year-item, .dp-month-item {
            text-align: center;
            font-size: 12px;
            padding: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
            color: #e5e7eb;
        }
        .dp-year-item:hover, .dp-month-item:hover { background: #1e3a5f; color: #ffd700; }
        .dp-year-item.selected, .dp-month-item.selected { background: #ffd700; color: #0a192f; font-weight: 700; }

        .sort-icon { font-size: 0.7rem; opacity: 0.3; margin-left: 4px; }
        .sorted-asc .sort-icon::after { content: '▲'; opacity: 1; color: #ffd700; }
        .sorted-desc .sort-icon::after { content: '▼'; opacity: 1; color: #ffd700; }
        .unsorted .sort-icon::after { content: '↕'; }

        /* Stock code clickable badge */
        .stock-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #60a5fa;
            font-weight: 700;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.18s ease;
            white-space: nowrap;
            user-select: none;
        }
        .stock-badge:hover,
        tr:hover .stock-badge,
        tr.row-touched .stock-badge {
            color: #ffd700;
            background-color: rgba(255, 215, 0, 0.08);
            border-color: rgba(255, 215, 0, 0.3);
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        /* Chart icon — hidden by default, shown on row hover/touch */
        .stock-badge .chart-icon {
            opacity: 0;
            transition: opacity 0.18s ease;
            flex-shrink: 0;
        }
        .stock-badge:hover .chart-icon,
        tr:hover .stock-badge .chart-icon,
        tr.row-touched .stock-badge .chart-icon {
            opacity: 1;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Company name tooltip */
        #company-tooltip {
            position: fixed;
            z-index: 99999;
            background: #1e3a5f;
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #f3f4f6;
            font-size: 12px;
            font-weight: 600;
            line-height: 1.5;
            padding: 8px 12px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-width: min(280px, calc(100vw - 24px));
            pointer-events: none;
            opacity: 0;
            transform: translateY(4px);
            transition: opacity 0.18s ease, transform 0.18s ease;
            word-break: break-word;
        }
        #company-tooltip.visible {
            opacity: 1;
            transform: translateY(0);
        }
        /* Progress bar at bottom of tooltip */
        #company-tooltip::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 215, 0, 0.5);
            border-radius: 0 0 10px 10px;
            transform-origin: left;
            animation: none;
        }
        #company-tooltip.visible::after {
            animation: tooltip-drain 4s linear forwards;
        }
        @keyframes tooltip-drain {
            from { transform: scaleX(1); }
            to   { transform: scaleX(0); }
        }

        /* Company name cell — show pointer cursor */
        .company-name-cell {
            cursor: pointer;
        }
        .company-name-cell:hover {
            color: #e5e7eb;
        }

        /* Tab Navigation Styles */
        .tab-button {
            color: #9ca3af;
            background: transparent;
            border: none;
            cursor: pointer;
            user-select: none;
            position: relative;
            border-radius: 10px;
            margin: 0 1px;
        }
        /* Responsive tab padding & font size */
        .tab-btn-responsive {
            padding: 6px 10px;
            font-size: 11px;
            white-space: nowrap;
        }
        @media (min-width: 480px) {
            .tab-btn-responsive {
                padding: 8px 14px;
                font-size: 12px;
            }
        }
        @media (min-width: 640px) {
            .tab-btn-responsive {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
        /* Hide scrollbar on the tab wrapper */
        .tab-scroll-wrapper::-webkit-scrollbar { display: none; }
        .tab-button:hover {
            color: #fef9c3;
            background: rgba(255, 255, 255, 0.06);
        }
        .tab-button.active {
            color: #0a192f;
            background: #ffd700;
            box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
        }
        /* Green tab (Stable Volatility) when active */
        #tab-stable.active {
            background: #10b981;
            color: white;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
        }
        /* Red tab (High Volatility) when active */
        #tab-high.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
        }
        .tab-button:active {
            transform: scale(0.98);
        }

        /* Video play button on tab */
        .tab-video-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255,215,0,0.15);
            border: 1px solid rgba(255,215,0,0.4);
            margin-left: 5px;
            vertical-align: middle;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .tab-video-btn:hover {
            background: rgba(255,215,0,0.35);
            border-color: #ffd700;
            transform: scale(1.1);
        }
        .tab-button.active .tab-video-btn {
            background: rgba(0,0,0,0.2);
            border-color: rgba(0,0,0,0.3);
        }

        /* Filter Popup Styles */
        #filterPopup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 10000;
            background: #112240;
            border: 1px solid #374151;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            min-width: 320px;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #filterPopup.open {
            opacity: 1;
            pointer-events: all;
            transform: translate(-50%, -50%) scale(1);
        }
        #filterOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #filterOverlay.open {
            opacity: 1;
            pointer-events: all;
        }
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-section:last-child {
            margin-bottom: 0;
        }
        .filter-section-title {
            font-size: 14px;
            font-weight: 700;
            color: #ffd700;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 215, 0, 0.05);
            border-radius: 8px;
            transition: all 0.15s;
        }
        .filter-section-title:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .filter-section-title .expand-icon {
            width: 16px;
            height: 16px;
            transition: transform 0.2s ease;
        }
        .filter-section-title.expanded .expand-icon {
            transform: rotate(180deg);
        }
        .filter-section-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .filter-section-content.expanded {
            max-height: 400px;
            overflow-y: auto;
        }
        .filter-section-content.expanded::-webkit-scrollbar {
            width: 6px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-track {
            background: #0a192f;
            border-radius: 3px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 3px;
        }
        .filter-section-content.expanded::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
        .filter-search {
            width: 100%;
            background: #0a192f;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 8px 36px 8px 12px;
            color: white;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .filter-search:focus {
            outline: none;
            border-color: #ffd700;
        }
        .filter-search-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .filter-search-wrapper .filter-search {
            margin-bottom: 0;
        }
        .filter-search-clear {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #6b7280;
            cursor: pointer;
            font-size: 13px;
            line-height: 1;
            padding: 2px 4px;
            border-radius: 4px;
            transition: color 0.15s;
        }
        .filter-search-clear:hover {
            color: #e5e7eb;
        }
        .filter-search-clear.hidden {
            display: none;
        }
        .filter-option {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            user-select: none;
        }
        .filter-option:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .filter-checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid #4b5563;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a192f;
            flex-shrink: 0;
            transition: all 0.15s;
        }
        .filter-option.selected .filter-checkbox {
            background: #ffd700;
            border-color: #ffd700;
        }
        .filter-checkbox svg {
            width: 12px;
            height: 12px;
            color: #0a192f;
            display: none;
        }
        .filter-option.selected .filter-checkbox svg {
            display: block;
        }
        .filter-label {
            font-size: 13px;
            color: #e5e7eb;
            flex: 1;
        }
        .filter-count {
            font-size: 11px;
            color: #9ca3af;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }
        .filter-volume-section {
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid #374151;
            border-radius: 12px;
            margin-top: 12px;
        }
        .volume-input-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .volume-input-item {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .volume-input-with-spinner {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .volume-input-label {
            font-size: 12px;
            font-weight: 600;
            color: #d1d5db;
        }
        .filter-volume-input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #374151;
            background: #0a192f;
            color: #e5e7eb;
            font-size: 13px;
        }
        .volume-spinner {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .volume-spinner-btn {
            width: 32px;
            height: 28px;
            border: 1px solid #374151;
            border-radius: 8px;
            background: #112240;
            color: #e5e7eb;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .volume-spinner-btn:hover {
            border-color: #ffd700;
            color: #ffd700;
        }
        .filter-volume-input:focus {
            outline: none;
            border-color: #ffd700;
        }
        .filter-volume-description {
            margin-top: 12px;
            font-size: 13px;
            color: #d1d5db;
        }
        .filter-actions {
            display: flex;
            gap: 8px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }
        .filter-btn {
            flex: 1;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s;
            border: none;
        }
        .filter-btn-apply {
            background: #ffd700;
            color: #0a192f;
        }
        .filter-btn-apply:hover {
            background: #ffed4e;
            transform: scale(1.02);
        }
        .filter-btn-clear {
            background: #374151;
            color: white;
        }
        .filter-btn-clear:hover {

    <script>
        // ─── Custom Date Picker ───────────────────────────────────────────────────
        // Force GMT+7 (Vietnam timezone) for all date operations
        const GMT7_OFFSET = 7 * 60; // 7 hours in minutes
        
        function getGMT7Date() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            const gmt7 = new Date(utc + (GMT7_OFFSET * 60000));
            gmt7.setHours(0, 0, 0, 0);
            return gmt7;
        }
        
        function createGMT7Date(year, month, day) {
            // Create date in GMT+7
            const date = new Date(Date.UTC(year, month, day, -7, 0, 0)); // UTC time minus 7 hours = GMT+7 midnight
            return date;
        }
        
        function parseISOtoGMT7(iso) {
            // Parse YYYY-MM-DD as GMT+7 midnight
            const [y, m, d] = iso.split('-').map(Number);
            return createGMT7Date(y, m - 1, d);
        }
        
        let dpLocale = {};
        function syncDatepickerLocaleFromI18n() {
            if (!i18n) return;
            Object.keys(i18n).forEach(function (lang) {
                const d = i18n[lang].datepicker;
                if (d && d.months && d.days) {
                    dpLocale[lang] = { months: d.months, days: d.days };
                }
            });
        }

        // Each picker: { inputEl, popupEl, value (Date|null), viewYear, viewMonth, mode:'day'|'month'|'year', min, max, onChange }
        const pickers = {};

        function isoToDisplay(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }

        function dateToIso(d) {
            // Convert Date to YYYY-MM-DD in GMT+7
            const utc = d.getTime() + (d.getTimezoneOffset() * 60000);
            const gmt7 = new Date(utc + (GMT7_OFFSET * 60000));
            const y = gmt7.getFullYear();
            const m = String(gmt7.getMonth() + 1).padStart(2, '0');
            const day = String(gmt7.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function createPicker(id, onChange) {
            const inputEl  = document.getElementById(id);
            const popupEl  = document.getElementById(id + 'Popup');
            const today = getGMT7Date();
            const picker   = { inputEl, popupEl, value: null, viewYear: today.getFullYear(), viewMonth: today.getMonth(), mode: 'day', min: null, max: null, onChange };
            pickers[id]    = picker;

            inputEl.addEventListener('click', (e) => { e.stopPropagation(); togglePicker(id); });
            inputEl.addEventListener('keydown', (e) => { if (e.key === 'Escape') closePicker(id); });
            popupEl.addEventListener('click', (e) => e.stopPropagation());
            return picker;
        }

        function togglePicker(id) {
            const picker = pickers[id];
            const isOpen = picker.popupEl.classList.contains('open');
            // Close all pickers first
            Object.keys(pickers).forEach(k => closePicker(k));
            if (!isOpen) {
                picker.mode = 'day';
                renderPicker(id);
                picker.popupEl.classList.add('open');
            }
        }

        function closePicker(id) {
            pickers[id].popupEl.classList.remove('open');
        }

        function renderPicker(id) {
            const picker = pickers[id];
            const loc    = dpLocale[state.lang];
            const { viewYear, viewMonth, value, min, max } = picker;
            const today  = getGMT7Date();
            console.debug('renderPicker', id, viewYear, viewMonth, 'min=', min, 'max=', max, 'value=', value);
            const firstDay = createGMT7Date(viewYear, viewMonth, 1);
            let startDow = firstDay.getDay(); // 0=Sun
            startDow = (startDow === 0) ? 6 : startDow - 1; // Mon-based

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();

            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavMonth('${id}',-1)">&#8249;</button>
                <span class="dp-month-year" onclick="dpSetMode('${id}','month')">${loc.months[viewMonth]} ${viewYear}</span>
                <button class="dp-nav-btn" onclick="dpNavMonth('${id}',1)">&#8250;</button>
            </div>
            <div class="dp-grid">`;

            loc.days.forEach(d => { html += `<div class="dp-day-name">${d}</div>`; });

            for (let i = 0; i < startDow; i++) html += `<div class="dp-day dp-day-empty"></div>`;

            for (let d = 1; d <= daysInMonth; d++) {
                const thisDate = createGMT7Date(viewYear, viewMonth, d);
                const iso = dateToIso(thisDate);
                const isSelected = value && dateToIso(value) === iso;
                const isToday    = thisDate.getTime() === today.getTime();
                // Compare Date objects properly: disable if before min OR after max
                const disabled   = (min && thisDate < min) || (max && thisDate > max);
                let cls = 'dp-day';
                if (disabled)   cls += ' dp-day-disabled';
                if (isToday)    cls += ' dp-day-today';
                if (isSelected) cls += ' dp-day-selected';
                const click = disabled ? '' : `onclick="dpSelectDay('${id}','${iso}')"`;
                html += `<div class="${cls}" ${click}>${d}</div>`;
            }

            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function renderMonthView(id, loc) {
            const picker = pickers[id];
            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavYear('${id}',-1)">&#8249;</button>
                <span class="dp-month-year" onclick="dpSetMode('${id}','year')">${picker.viewYear}</span>
                <button class="dp-nav-btn" onclick="dpNavYear('${id}',1)">&#8250;</button>
            </div><div class="dp-year-grid">`;
            loc.months.forEach((m, i) => {
                const sel = picker.value && picker.value.getMonth() === i && picker.value.getFullYear() === picker.viewYear ? 'selected' : '';
                html += `<div class="dp-month-item ${sel}" onclick="dpSelectMonth('${id}',${i})">${m}</div>`;
            });
            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function renderYearView(id, loc) {
            const picker = pickers[id];
            const base   = picker.viewYear - 6;
            let html = `<div class="dp-header">
                <button class="dp-nav-btn" onclick="dpNavYearPage('${id}',-12)">&#8249;</button>
                <span class="dp-month-year">${base} – ${base + 11}</span>
                <button class="dp-nav-btn" onclick="dpNavYearPage('${id}',12)">&#8250;</button>
            </div><div class="dp-year-grid">`;
            for (let y = base; y < base + 12; y++) {
                const sel = picker.value && picker.value.getFullYear() === y ? 'selected' : '';
                html += `<div class="dp-year-item ${sel}" onclick="dpSelectYear('${id}',${y})">${y}</div>`;
            }
            html += `</div>`;
            picker.popupEl.innerHTML = html;
        }

        function dpNavMonth(id, delta) {
            const p = pickers[id];
            let m = p.viewMonth + delta, y = p.viewYear;
            if (m < 0)  { m = 11; y--; }
            if (m > 11) { m = 0;  y++; }
            p.viewMonth = m; p.viewYear = y;
            renderPicker(id);
        }
        function dpNavYear(id, delta)     { pickers[id].viewYear += delta; renderPicker(id); }
        function dpNavYearPage(id, delta) { pickers[id].viewYear += delta; renderPicker(id); }
        function dpSetMode(id, mode)      { pickers[id].mode = mode; renderPicker(id); }

        function dpSelectYear(id, y) {
            pickers[id].viewYear = y;
            pickers[id].mode = 'month';
            renderPicker(id);
        }
        function dpSelectMonth(id, m) {
            pickers[id].viewMonth = m;
            pickers[id].mode = 'day';
            renderPicker(id);
        }
        function dpSelectDay(id, iso) {
            const p = pickers[id];
            p.value = parseISOtoGMT7(iso);
            p.inputEl.value = isoToDisplay(iso);
            closePicker(id);
            p.onChange(iso);
        }

        function setPickerValue(id, iso) {
            const p = pickers[id];
            if (!iso) return;
            p.value = parseISOtoGMT7(iso);
            p.viewYear  = p.value.getFullYear();
            p.viewMonth = p.value.getMonth();
            p.inputEl.value = isoToDisplay(iso);
        }

        function setPickerLimits(id, min, max) {
            const p = pickers[id];
            p.min = min ? parseISOtoGMT7(min) : null;
            p.max = max ? parseISOtoGMT7(max) : null;
        }

        // Re-render open pickers when language changes (updates month/day names)
        function refreshOpenPickers() {
            Object.keys(pickers).forEach(id => {
                if (pickers[id].popupEl.classList.contains('open')) renderPicker(id);
            });
        }

        // Close pickers when clicking outside
        document.addEventListener('click', () => { Object.keys(pickers).forEach(id => closePicker(id)); });
        // ─────────────────────────────────────────────────────────────────────────

        const SUPABASE_URL = 'https://ifjxishcrzndbszmvpef.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlmanhpc2hjcnpuZGJzem12cGVmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczNjEwOTcsImV4cCI6MjA5MjkzNzA5N30.0rHs4AWTmRmN34WWdxBM2RsTMu1VQwfKDjve0W2yHEg';
        



        // Load translations from i18n.json
        let i18n = null;
        let i18nLangNames = {}; // native labels for language menu; filled by sync XHR + fetch
        let i18nVideoFiles = {}; // tab -> lang -> filename; filled by sync XHR + fetch

        // DEFAULT_LANG — read synchronously from i18n.json before any state is initialized
        const DEFAULT_LANG = (() => {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('GET', 'i18n.json', false); // synchronous
                xhr.send();
                const data = JSON.parse(xhr.responseText);
                if (data.langNames && typeof data.langNames === 'object') {
                    i18nLangNames = data.langNames;
                }
                if (data.videoFiles && typeof data.videoFiles === 'object') {
                    i18nVideoFiles = data.videoFiles;
                }
                return (data.languages && data.languages[0]) || 'vi';
            } catch (e) {
                return 'vi';
            }
        })();

        let i18nLanguages = [DEFAULT_LANG]; // populated from i18n.json after load
        let i18nFlags = {};                 // populated from i18n.json after load
        let i18nLangShort = {};             // populated from i18n.json after load

        async function loadTranslations() {
            try {
                const response = await fetch('i18n.json?v=' + CACHE_BUSTER);
                const data = await response.json();
                i18n = data.translations;
                if (data.languages && data.languages.length > 0) {
                    i18nLanguages = data.languages;
                }
                if (data.flags) {
                    i18nFlags = data.flags;
                }
                if (data.lang) {
                    i18nLangShort = data.lang;
                }
                if (data.langNames && typeof data.langNames === 'object') {
                    i18nLangNames = data.langNames;
                }
                if (data.videoFiles && typeof data.videoFiles === 'object') {
                    i18nVideoFiles = data.videoFiles;
                }

                // Attach flag markup and language labels to translations so applyTranslations can use them consistently
                Object.keys(i18nLanguages).forEach(lang => {
                    const languageCode = i18nLanguages[lang];
                    if (i18n[languageCode]) {
                        i18n[languageCode].lang = i18n[languageCode].lang || {};
                                if (i18nFlags[languageCode]) {
                            i18n[languageCode].lang.flag = i18nFlags[languageCode];
                        }
                        if (i18nLangShort[languageCode]) {
                            i18n[languageCode].lang.short = i18nLangShort[languageCode];
                        }
                    } else {
                        // Ensure unsupported languages do not break the UI by falling back to English or default translations.
                        i18n[languageCode] = i18n.en || i18n[DEFAULT_LANG] || {};
                        i18n[languageCode].lang = i18n[languageCode].lang || {};
                        if (i18nFlags[languageCode]) {
                            i18n[languageCode].lang.flag = i18nFlags[languageCode];
                        }
                        if (i18nLangShort[languageCode]) {
                            i18n[languageCode].lang.short = i18nLangShort[languageCode];
                        }
                    }
                });

                // Derive default language from i18n.json languages array
                // (DEFAULT_LANG is already set via sync XHR at startup; state objects
                //  are already initialized with the correct value)
                
                // Convert paging strings to functions
                Object.keys(i18n).forEach(lang => {
                    const pagingTemplate = i18n[lang].paging;
                    i18n[lang].paging = function(start, end, total) {
                        return pagingTemplate
                            .replace('{start}', start)
                            .replace('{end}', end)
                            .replace('{total}', total);
                    };
                });
                syncDatepickerLocaleFromI18n();
                
                console.log('Translations loaded successfully, default lang:', DEFAULT_LANG);
                applyTranslations(); // Apply translations after loading
                // Header may load before i18n.json on slow networks; rebuild language menu when languages are known
                if (typeof window.refreshLanguageMenuHtml === 'function') {
                    window.refreshLanguageMenuHtml();
                }
            } catch (error) {
                console.error('Failed to load translations:', error);
            }
        }

        // Apply translations to elements with data attributes
        function applyTranslations(lang = DEFAULT_LANG) {
            if (!i18n) return;
            const translationRoot = i18n[lang] || i18n[DEFAULT_LANG] || i18n.en || {};

            // Apply data-text-key attributes
            document.querySelectorAll('[data-text-key]').forEach(el => {
                const key = el.getAttribute('data-text-key');
                const keys = key.split('.');
                let value = translationRoot;
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.textContent = value;
            });

            // Apply data-title-key attributes
            document.querySelectorAll('[data-title-key]').forEach(el => {
                const key = el.getAttribute('data-title-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('title', value);
            });

            // Apply data-placeholder-key attributes
            document.querySelectorAll('[data-placeholder-key]').forEach(el => {
                const key = el.getAttribute('data-placeholder-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('placeholder', value);
            });
            // Apply data-alt-key attributes
            document.querySelectorAll('[data-alt-key]').forEach(el => {
                const key = el.getAttribute('data-alt-key');
                const keys = key.split('.');
                let value = i18n[lang];
                for (const k of keys) {
                    value = value?.[k];
                }
                if (value) el.setAttribute('alt', value);
            });

            const pg = i18n[lang].page;
            if (pg && pg.documentTitle) document.title = pg.documentTitle;
            const metaDesc = document.querySelector('meta[name="description"]');
            if (metaDesc && pg && pg.metaDescription) metaDesc.setAttribute('content', pg.metaDescription);
            document.documentElement.lang = lang;

            // Sync flag from i18nFlags or translation wrapper
            const flagEl = document.getElementById('langFlag');
            if (flagEl) {
                const flagMarkup = i18nFlags[lang] || i18n[lang]?.lang?.flag;
                if (flagMarkup) {
                    flagEl.innerHTML = flagMarkup;
                    // Set flag style
                    const svg = flagEl.querySelector('svg');
                    if (svg) {
                        svg.style.width = '22px';
                        svg.style.height = '15px';
                        svg.style.borderRadius = '2px';
                        svg.style.display = 'block';
                    }
                }
            }

            // Sync language short code
            const langTextEl = document.getElementById('langText');
            if (langTextEl) {
                const langShort = i18nLangShort[lang] || i18n[lang]?.lang?.short || lang.toUpperCase();
                langTextEl.textContent = langShort;
            }
        }

        // Load translations and then load JS files
        function loadScripts() {
            const scripts = [
                'coreview_stock.js',
                'coreview_macro.js',
                'coreview_stable.js',
                'coreview_high.js',
                'coreview_watchlist.js',
                'coreview_spotlight.js'
            ];

            return Promise.all(scripts.map(src => new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src + '?v=' + CACHE_BUSTER;
                script.async = false; // Maintain execution order
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            })));
        }

        async function initApp() {
            try {
                await Promise.all([
                    loadTranslations(),
                    loadStaticTranslations()
                ]);
                await loadScripts();
                applyTranslations(state.lang || DEFAULT_LANG);
                if (typeof updateTabLabels === 'function') updateTabLabels();
                // Note: setupLanguageToggle will be called after header is loaded (see fetch block)
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', () => loadCoreView('stock'));
                } else {
                    loadCoreView('stock');
                }
            } catch (error) {
                console.error('App initialization failed:', error);
            }
        }

        initApp();

        // flags are now stored in i18n[lang].lang.flag — no hardcoded object needed
        // ─────────────────────────────────────────────────────────────────────────
        // STATIC TRANSLATIONS — loaded from pre-built JSON files
        // companyMap: { ticker -> { vi, en, ko, zh, ... } }
        // industryByVi: { vi_name -> { vi, en, ko, zh, ... } }
        // ─────────────────────────────────────────────────────────────────────────
        let companyMap = {};    // keyed by ticker (single_stock)
        let industryByVi = {};  // keyed by Vietnamese industry name

        // Cache key: "${event_id}_${lang_code}" → translated headline string (or null = not found)
        window.headlineTranslationCache = Object.create(null);

        /**
         * Batch-prefetch translated headlines for the given rows + lang.
         * No-op for 'vi' (source language — headlines are already Vietnamese).
         * Fetches from mul_lang_headline filtered by lang_code + event_id list.
         * @param {Array} rows  - data rows, each must have .event_id
         * @param {string} lang - target language code (e.g. 'en', 'ko', 'zh')
         */
        window.prefetchHeadlineTranslations = async function(rows, lang) {
            if (!rows || rows.length === 0) return;
            if (!lang || lang === 'vi') return; // Vietnamese is source — no lookup needed

            // Collect event_ids not yet cached for this lang
            const missing = rows
                .filter(r => r.event_id != null && !((`${r.event_id}_${lang}`) in window.headlineTranslationCache))
                .map(r => r.event_id);

            // Debug: log which rows have null event_id
            const nullIds = rows.filter(r => r.event_id == null);
            if (nullIds.length > 0) {
                console.warn(`[HeadlineTrans] ${nullIds.length} rows have null event_id — cannot translate:`, nullIds.map(r => r.headline?.substring(0, 50)));
            }

            if (missing.length === 0) {
                console.log(`[HeadlineTrans] All ${rows.length} rows already cached for lang="${lang}"`);
                return;
            }

            try {
                const ids = missing.join(',');
                const url = `${SUPABASE_URL}/rest/v1/mul_lang_headline?select=event_id,headline&lang_code=eq.${lang}&event_id=in.(${ids})`;
                console.log(`[HeadlineTrans] Fetching ${missing.length} translations (lang=${lang}):`, url);
                const res = await fetch(url, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                console.log(`[HeadlineTrans] Response (${Array.isArray(data) ? data.length : 'ERROR'} records):`, data);
                if (Array.isArray(data)) {
                    data.forEach(r => {
                        window.headlineTranslationCache[`${r.event_id}_${lang}`] = r.headline || '';
                    });
                }
                // Mark all missing as resolved (null = not found → will fall back to row.headline)
                missing.forEach(id => {
                    const key = `${id}_${lang}`;
                    if (!(key in window.headlineTranslationCache)) {
                        console.log(`[HeadlineTrans] No translation found for event_id="${id}" lang="${lang}" — using fallback`);
                        window.headlineTranslationCache[key] = null;
                    }
                });
            } catch (e) {
                console.warn('[HeadlineTrans] prefetchHeadlineTranslations error:', e);
            }
        };

        async function refreshBoundsForTab(tab) {
            const volumeBounds = await fetchVolumeBoundsForTab(tab);
            const priceBounds = await fetchPriceBoundsForTab(tab);
            volumeBoundsCache[tab] = volumeBounds;
            priceBoundsCache[tab] = priceBounds;
            volumeDefaults[tab] = { min: volumeBounds.min, max: volumeBounds.max };
            priceDefaults[tab] = { min: priceBounds.min, max: priceBounds.max };

            const tabFilterState = tab === 'stock' ? filterState.stock :
                tab === 'stable' ? filterState.stable :
                tab === 'high' ? filterState.high :
                tab === 'watchlist' ? filterState.watchlist :
                tab === 'spotlight' ? filterState.spotlight : null;

            if (tabFilterState) {
                tabFilterState.volumeDefaults = { min: volumeBounds.min, max: volumeBounds.max };
                tabFilterState.priceDefaults = { min: priceBounds.min, max: priceBounds.max };
            }
        }

        async function ensureBoundsForTab(tab) {
            if (!volumeBoundsCache[tab] || !priceBoundsCache[tab]) {
                await refreshBoundsForTab(tab);
            }
            return {
                volume: volumeBoundsCache[tab] || { min: 0, max: 0 },
                price: priceBoundsCache[tab] || { min: 0, max: 0 }

        // Normalize Vietnamese text for search (removes diacritics)
        function normalizeFilterText(text) {
            if (!text) return '';
            let s = text.toLowerCase();
            const map = {
                'à':'a','á':'a','ả':'a','ã':'a','ạ':'a',
                'ă':'a','ằ':'a','ắ':'a','ẳ':'a','ẵ':'a','ặ':'a',
                'â':'a','ầ':'a','ấ':'a','ẩ':'a','ẫ':'a','ậ':'a',
                'đ':'d',
                'è':'e','é':'e','ẻ':'e','ẽ':'e','ẹ':'e',
                'ê':'e','ề':'e','ế':'e','ể':'e','ễ':'e','ệ':'e',
                'ì':'i','í':'i','ỉ':'i','ĩ':'i','ị':'i',
                'ò':'o','ó':'o','ỏ':'o','õ':'o','ọ':'o',
                'ô':'o','ồ':'o','ố':'o','ổ':'o','ỗ':'o','ộ':'o',
                'ơ':'o','ờ':'o','ớ':'o','ở':'o','ỡ':'o','ợ':'o',
                'ù':'u','ú':'u','ủ':'u','ũ':'u','ụ':'u',
                'ư':'u','ừ':'u','ứ':'u','ử':'u','ữ':'u','ự':'u',
                'ỳ':'y','ý':'y','ỷ':'y','ỹ':'y','ỵ':'y'
            };
            for (const [a, b] of Object.entries(map)) {
                s = s.replace(new RegExp(a, 'g'), b);
            }
            return s;
        }

        // Setup filter search functionality
        function setupFilterSearch(inputId, containerId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            
            if (!input || !container) return;
            
            input.addEventListener('input', (e) => {
                const raw = e.target.value;
                const query = normalizeFilterText(raw);
                const options = container.querySelectorAll('.filter-option');
                
                options.forEach(option => {
                    const label = normalizeFilterText(option.querySelector('.filter-label').textContent);
                    option.style.display = label.includes(query) ? 'flex' : 'none';
                });
            });
        }
        
        // Clear filter search input and show all options
        function clearFilterSearch(inputId, containerId, clearBtnId) {
            const input = document.getElementById(inputId);
            const container = document.getElementById(containerId);
            const clearBtn = document.getElementById(clearBtnId);
            
            if (input) input.value = '';
            if (clearBtn) clearBtn.classList.add('hidden');
            
            // Show all options
            if (container) {
                container.querySelectorAll('.filter-option').forEach(opt => {
                    opt.style.display = 'flex';
                });
            }
            
            // Refocus input
            if (input) input.focus();
        }

        function getVolumeBoundsForTab(tab) {
            const dataMap = {
                stock: state && state.data ? state.data : [],
                stable: stateStable && stateStable.data ? stateStable.data : [],
                high: stateHigh && stateHigh.data ? stateHigh.data : [],
                watchlist: stateWatchlist && stateWatchlist.data ? stateWatchlist.data : [],
                spotlight: stateSpotlight && stateSpotlight.data ? stateSpotlight.data : []
            };
            const rows = dataMap[tab] || [];
            const values = rows
                .map(row => parseVolumeNumber(row.current_volume))
                .filter(v => Number.isFinite(v));

            if (values.length === 0) {
                return { min: 0, max: 0 };
            }

            const min = Math.min(...values) / 1000000;
            const max = Math.max(...values) / 1000000;
            const minRounded = Math.floor(min * 100) / 100;
            const maxRounded = Math.ceil(max * 100) / 100;
            return {
                min: Number(minRounded.toFixed(2)),
                max: Number(maxRounded.toFixed(2))
            };
        }

        function parseVolumeNumber(value) {
            if (value === null || value === undefined) return NaN;
            if (typeof value === 'number') return Number(value);
            const normalized = String(value)
                .trim()
                .replace(/\s+/g, '')
                .replace(/,/g, '.')
                .replace(/[^0-9.\-]/g, '');
            return Number(normalized);
        }

        function formatRangeText(label, unit, minM, maxM, decimals = 2) {
            const fmt = (value) => {
                const n = parseVolumeNumber(value);
                if (!Number.isFinite(n)) {
                    return decimals === 1 ? '0.0' : '0.00';
                }
                return n.toFixed(decimals);
            };
            const unitText = unit ? ` ${unit}` : '';
            return `${label}: ${fmt(minM)} – ${fmt(maxM)}${unitText}`;
        }

        function clampVolumeValue(value, min, max) {
            let num = parseVolumeNumber(value);
            if (!Number.isFinite(num)) {
                num = min;
            }
            if (num < min) num = min;
            if (num > max) num = max;
            return Number(num.toFixed(2));
        }

        function updateFilterVolumeDescription(tab) {
            const minInput = document.getElementById('filterVolumeMin');
            const maxInput = document.getElementById('filterVolumeMax');
            const desc = document.getElementById('filterVolumeDescription');
            if (!minInput || !maxInput || !desc) return;

            const minValue = Number(minInput.value) || 0;
            const maxValue = Number(maxInput.value) || 0;
            desc.textContent = formatRangeText(i18n[state.lang].filter.volumeLabel || i18n[state.lang].cols?.current_volume, i18n[state.lang].filter.volumeUnit, minValue, maxValue);
        }

        function updateFilterPriceDescription(tab) {
            const minInput = document.getElementById('filterPriceMin');
            const maxInput = document.getElementById('filterPriceMax');
            const desc = document.getElementById('filterPriceDescription');
            if (!minInput || !maxInput || !desc) return;

            const t = i18n[state.lang].filter;
            const label = t.priceLabel || i18n[state.lang].cols?.current_close;
            const unit = t.priceUnit || '';
            const minValue = Number(minInput.value) || 0;
            const maxValue = Number(maxInput.value) || 0;
            desc.textContent = formatRangeText(label, unit, minValue, maxValue, 1);
        }

        function normalizeDecimalInput(value) {
            return String(value).replace(/,/g, '.');
        }

        function sanitizeNumericString(value) {
            let s = normalizeDecimalInput(value);
            // Allow digits and at most one dot
            s = s.replace(/[^0-9.]/g, '');
            const parts = s.split('.');
            if (parts.length > 2) {
                s = parts[0] + '.' + parts.slice(1).join('');
            }
            return s;
        }

        function onVolumeInputChange(tab, key) {
            const minInput = document.getElementById('filterVolumeMin');
            const maxInput = document.getElementById('filterVolumeMax');
            if (!minInput || !maxInput) return;

            // Allow free-form typing: sanitize characters but do not force formatting
            // or replace the user's partial input while they are typing. Only
            // update the canonical filter state when the typed value parses to
            // a finite number. Final formatting is applied on blur or via the
            // spinner buttons.
            const sMin = sanitizeNumericString(minInput.value);
            const sMax = sanitizeNumericString(maxInput.value);
            // Keep the user's current edit (sanitized) in the field so backspace works
            minInput.value = sMin;
            maxInput.value = sMax;

            const bounds = getVolumeBoundsForTab(tab);
            const parsedMin = parseVolumeNumber(sMin);
            const parsedMax = parseVolumeNumber(sMax);

            // Update internal filter state only when values are valid numbers.
            if (Number.isFinite(parsedMin) && Number.isFinite(parsedMax)) {
                let minValue = parsedMin;
                let maxValue = parsedMax;

                if (minValue < bounds.min) minValue = bounds.min;
                if (maxValue > bounds.max) maxValue = bounds.max;

                if (minValue > maxValue) {
                    if (key === 'min') minValue = maxValue;
                    else maxValue = minValue;
                }

                filterState[tab].volume = { min: Number(minValue.toFixed(2)), max: Number(maxValue.toFixed(2)) };
            }

            // Refresh the description using the current typed values where possible.
            updateFilterVolumeDescription(tab);
        }

        function onPriceInputChange(tab, key) {
            const minInput = document.getElementById('filterPriceMin');
            const maxInput = document.getElementById('filterPriceMax');
            if (!minInput || !maxInput) return;

            const bounds = getPriceBoundsForTab(tab);
            let currentMin = parseVolumeNumber(minInput.value);
            let currentMax = parseVolumeNumber(maxInput.value);
            if (!Number.isFinite(currentMin)) currentMin = bounds.min;
            if (!Number.isFinite(currentMax)) currentMax = bounds.max;

            if (key === 'min' && currentMin > currentMax) {
                currentMin = currentMax;
            }
            if (key === 'max' && currentMax < currentMin) {
                currentMax = currentMin;
            }

            filterState[tab].price = { min: Number(currentMin.toFixed(1)), max: Number(currentMax.toFixed(1)) };
            updateFilterPriceDescription(tab);
        }

        function adjustPriceInput(tab, key, delta) {
            const input = document.getElementById(`filterPrice${key === 'min' ? 'Min' : 'Max'}`);
            if (!input) return;

            input.value = sanitizeNumericString(input.value);
            let value = parseVolumeNumber(input.value);
            const bounds = getPriceBoundsForTab(tab);

            if (!Number.isFinite(value)) {
                value = key === 'min' ? bounds.min : bounds.max;
            }
            value = Number((value + delta).toFixed(2));

            if (key === 'min' && value < bounds.min) {
                value = bounds.min;
            }
            if (key === 'max' && value > bounds.max) {
                value = bounds.max;
            }

            if (key === 'min') {
                const maxValue = parseVolumeNumber(document.getElementById('filterPriceMax')?.value);
                if (Number.isFinite(maxValue) && value > maxValue) {
                    value = maxValue;
                }
            } else {
                const minValue = parseVolumeNumber(document.getElementById('filterPriceMin')?.value);
                if (Number.isFinite(minValue) && value < minValue) {
                    value = minValue;
                }
            }

            input.value = value.toFixed(1);
            filterState[tab].price[key] = Number(value.toFixed(1));
            updateFilterPriceDescription(tab);
        }

        function onPriceInputBlur(tab, key) {
            const minInput = document.getElementById('filterPriceMin');
            const maxInput = document.getElementById('filterPriceMax');
            if (!minInput || !maxInput) return;

            minInput.value = sanitizeNumericString(minInput.value);
            maxInput.value = sanitizeNumericString(maxInput.value);

            const bounds = getPriceBoundsForTab(tab);
            let minValue = parseVolumeNumber(minInput.value);
            let maxValue = parseVolumeNumber(maxInput.value);

            if (!Number.isFinite(minValue)) {
                minValue = bounds.min;
            }
            if (!Number.isFinite(maxValue)) {
                maxValue = bounds.max;
            }

            if (minValue < bounds.min) {
                minValue = bounds.min;
            }
            if (maxValue > bounds.max) {
                maxValue = bounds.max;
            }

            if (minValue > maxValue) {
                if (key === 'min') {
                    minValue = maxValue;
                } else {
                    maxValue = minValue;
                }
            }

            minInput.value = minValue.toFixed(1);
            maxInput.value = maxValue.toFixed(1);
            filterState[tab].price = { min: Number(minValue.toFixed(1)), max: Number(maxValue.toFixed(1)) };
            updateFilterPriceDescription(tab);
        }

        function adjustVolumeInput(tab, key, delta) {
            const input = document.getElementById(`filterVolume${key === 'min' ? 'Min' : 'Max'}`);
            if (!input) return;

            input.value = sanitizeNumericString(input.value);
            let value = parseVolumeNumber(input.value);
            const bounds = getVolumeBoundsForTab(tab);

            if (!Number.isFinite(value)) {
                value = key === 'min' ? bounds.min : bounds.max;
            }
            value = Number((value + delta).toFixed(2));

            if (key === 'min' && value < bounds.min) {
                value = bounds.min;
            }
            if (key === 'max' && value > bounds.max) {
                value = bounds.max;
            }

            if (key === 'min') {
                const maxValue = parseVolumeNumber(document.getElementById('filterVolumeMax')?.value);
                if (Number.isFinite(maxValue) && value > maxValue) {
                    value = maxValue;
                }
            } else {
                const minValue = parseVolumeNumber(document.getElementById('filterVolumeMin')?.value);
                if (Number.isFinite(minValue) && value < minValue) {
                    value = minValue;
                }
            }

            input.value = value.toFixed(2);
            filterState[tab].volume[key] = value;
            updateFilterVolumeDescription(tab);
        }

        function onVolumeInputBlur(tab, key) {
            const minInput = document.getElementById('filterVolumeMin');
            const maxInput = document.getElementById('filterVolumeMax');
            if (!minInput || !maxInput) return;

            minInput.value = sanitizeNumericString(minInput.value);
            maxInput.value = sanitizeNumericString(maxInput.value);

            const bounds = getVolumeBoundsForTab(tab);
            let minValue = parseVolumeNumber(minInput.value);
            let maxValue = parseVolumeNumber(maxInput.value);

            if (!Number.isFinite(minValue)) {
                minValue = bounds.min;
            }
            if (!Number.isFinite(maxValue)) {
                maxValue = bounds.max;
            }

            if (minValue < bounds.min) {
                minValue = bounds.min;
            }
            if (maxValue > bounds.max) {
                maxValue = bounds.max;
            }

            if (minValue > maxValue) {
                if (key === 'min') {
                    minValue = maxValue;
                } else {
                    maxValue = minValue;
                }
            }

            minInput.value = minValue.toFixed(2);
            maxInput.value = maxValue.toFixed(2);
            filterState[tab].volume = { min: minValue, max: maxValue };
            updateFilterVolumeDescription(tab);
        }

        // Toggle individual filter (async wrapper)
        async function toggleFilterAsync(tab, field, value) {
            // Check if currently "none selected" (__NONE__ marker)
            const isNoneSelected = filterState[tab][field].has('__NONE__');
            
            if (isNoneSelected) {
                // Currently none selected, user wants to check one item
                // Clear the __NONE__ marker and add only this item
                filterState[tab][field].clear();
                filterState[tab][field].add(value);
            } else {
                // Check if currently "all selected" (empty set without __NONE__)
                const isAllSelected = filterState[tab][field].size === 0;
                
                if (isAllSelected) {
                    // Currently all selected, user wants to uncheck one item
                    // We need to explicitly select all OTHER items
                    
                    // Get all available items based on field type
                    let allItems = [];
                    if (field === 'single_stock') {
                        allItems = await getUniqueStockCodes();
                    } else if (field === 'ma15') {
                        allItems = getMA15Categories().map(v => v.key);
                    } else if (field === 'industry') {
                        allItems = await getUniqueIndustries();
                    } else if (field === 'source_name') {
                        allItems = await getUniqueSources();
                    }
                    
                    // Add all items EXCEPT the one being unchecked
                    allItems.forEach(item => {
                        if (item !== value) {
                            filterState[tab][field].add(item);
                        }
                    });
                } else {
                    // Normal toggle behavior (some items selected)
                    if (filterState[tab][field].has(value)) {
                        filterState[tab][field].delete(value);
                        
                        // If no items left after delete, set to __NONE__ (nothing selected)
                        if (filterState[tab][field].size === 0) {
                            filterState[tab][field].add('__NONE__');
                        }
                    } else {
                        filterState[tab][field].add(value);
                        
                        // Check if ALL items are now selected
                        // Get all available items based on field type
                        let allItems = [];
                        if (field === 'single_stock') {
                            allItems = await getUniqueStockCodes();
                        } else if (field === 'ma15') {
                            allItems = getMA15Categories().map(v => v.key);
                        } else if (field === 'industry') {
                            allItems = await getUniqueIndustries();
                        } else if (field === 'source_name') {
                            allItems = await getUniqueSources();
                        }
                        
                        // If all items are now selected, clear the set to represent "all selected"
                        if (filterState[tab][field].size === allItems.length) {
                            const allSelected = allItems.every(item => filterState[tab][field].has(item));
                            if (allSelected) {
                                filterState[tab][field].clear();
                            }
                        }
                    }
                }
            }
            
            // Update UI in-place (preserves scroll position)
            updateFilterUIInPlace(tab, field);
        }
        
        // Update filter UI in-place without rebuilding - preserves scroll position
        function updateFilterUIInPlace(tab, field) {
            const t = i18n[state.lang].filter;
            const fieldMap = {
                'single_stock': 'Stock',
                'ma15': 'MA15',
                'industry': 'Industry',
                'source_name': 'Source'
            };
            const containerId = `filterOptions${fieldMap[field]}`;
            const container = document.getElementById(containerId);
            if (!container) return;
            
            const fieldState = filterState[tab][field];
            const isNone = fieldState.has('__NONE__');
            const isAll = fieldState.size === 0 && !isNone;
            
            // Update each option checkbox
            const options = container.querySelectorAll('.filter-option');
            options.forEach(option => {
                const onclick = option.getAttribute('onclick') || '';
                // Extract value from onclick="toggleFilter('tab', 'field', 'VALUE')"
                const match = onclick.match(/toggleFilter\([^,]+,\s*[^,]+,\s*'([^']+)'\)/);
                if (!match) return;
                const itemValue = match[1];
                
                const isSelected = !isNone && (isAll || fieldState.has(itemValue));
                option.classList.toggle('selected', isSelected);
            });
            
            // Update "Select All" checkbox
            const sectionIdMap = {
                'single_stock': 'stock-code',
                'ma15': 'ma15',
                'industry': 'industry',
                'source_name': 'source'
            };
            const sectionContent = document.getElementById(`filter-section-${sectionIdMap[field]}`);
            if (sectionContent) {
                const selectAllEl = sectionContent.querySelector('.filter-select-all');
                if (selectAllEl) {
                    selectAllEl.classList.toggle('selected', isAll);
                }
            }
            
            // Update header count text
            const totalItems = container.querySelectorAll('.filter-option').length;
            const selectedCount = isNone ? 0 : (isAll ? totalItems : fieldState.size);
            const headerSpan = document.querySelector(`.filter-section-title[onclick*="${sectionIdMap[field]}"] span`);
            if (headerSpan) {
                const labelMap = {
                    'single_stock': t.stockCode,
                    'ma15': t.ma15,
                    'industry': t.industry,
                    'source_name': t.source
                };
                const label = labelMap[field];
                headerSpan.textContent = (selectedCount === totalItems)
                    ? `${label} (${totalItems})`
                    : `${label} (${selectedCount}/${totalItems})`;
            }
            
            // Update toggle button text (Select All / Clear All)
            const toggleBtn = document.querySelector('.filter-btn-clear');
            if (toggleBtn) {
                const allFieldsSelected = Object.keys(filterState[tab]).every(f => {
                    if (!(filterState[tab][f] instanceof Set)) return true;
                    return filterState[tab][f].size === 0 && !filterState[tab][f].has('__NONE__');
                });
                toggleBtn.textContent = allFieldsSelected ? t.clearAll : t.selectAllBtn;
            }
        }
        
        // Synchronous wrapper for onclick handlers
        function toggleFilter(tab, field, value) {
            toggleFilterAsync(tab, field, value).catch(err => {
                console.error('Error toggling filter:', err);
            });
        }

        // Toggle select all
        function toggleSelectAll(field) {
            const tab = currentTab;
            const fieldMap = {
                'single_stock': 'Stock',
                'ma15': 'MA15',
                'industry': 'Industry',
                'source_name': 'Source'
            };

            if (isAllSelected) {
                filterState[tab][field].clear();

        // Clear all filters (uncheck all items)
        function clearFilters() {
            const tab = currentTab;
            Object.keys(filterState[tab]).forEach(field => {
                if (filterState[tab][field] instanceof Set) {
                    filterState[tab][field].clear();
                    // Set to __NONE__ to indicate "nothing selected"
                    filterState[tab][field].add('__NONE__');
                } else if (field === 'volume' || field === 'price') {
                    const isPrice = field === 'price';
                    const defaultsKey = isPrice ? 'priceDefaults' : 'volumeDefaults';
                    const globalDefaults = isPrice ? priceDefaults[tab] : volumeDefaults[tab];
                    const boundsFn = isPrice ? getPriceBoundsForTab : getVolumeBoundsForTab;
                    const inputPrefix = isPrice ? 'filterPrice' : 'filterVolume';

                    let defaults = (filterState[tab] && filterState[tab][defaultsKey]) ? filterState[tab][defaultsKey] : globalDefaults;
                    if (!defaults) {
                        const minInput = document.getElementById(`${inputPrefix}Min`);
                        const maxInput = document.getElementById(`${inputPrefix}Max`);
                        if (minInput && maxInput) {
                            const tryMin = parseVolumeNumber(minInput.defaultValue || minInput.value);
                            const tryMax = parseVolumeNumber(maxInput.defaultValue || maxInput.value);
                            if (Number.isFinite(tryMin) && Number.isFinite(tryMax)) {
                                defaults = { min: Number(tryMin.toFixed(2)), max: Number(tryMax.toFixed(2)) };
                            }
                        }
                    }
                    if (!defaults) {
                        defaults = boundsFn(tab);
                    }
                    filterState[tab][field] = { min: defaults.min, max: defaults.max };
                }
            });
            
            // Update UI
            buildFilterContent();
        }
        
        // Select all filters (check all items)
        function selectAllFilters() {
            const tab = currentTab;
            Object.keys(filterState[tab]).forEach(field => {
                if (filterState[tab][field] instanceof Set) {
                    filterState[tab][field].clear();
                    // Empty set means "all selected"
                } else if (field === 'volume' || field === 'price') {
                    const isPrice = field === 'price';
                    const stateDefaults = (filterState[tab] && filterState[tab][isPrice ? 'priceDefaults' : 'volumeDefaults']) ? filterState[tab][isPrice ? 'priceDefaults' : 'volumeDefaults'] : null;
                    const globalDefaults = isPrice ? priceDefaults[tab] : volumeDefaults[tab] || null;
                    const inputPrefix = isPrice ? 'filterPrice' : 'filterVolume';
                    const boundsFn = isPrice ? getPriceBoundsForTab : getVolumeBoundsForTab;

                    let defaults = stateDefaults || globalDefaults;
                    if (!defaults) {
                        const minInput = document.getElementById(`${inputPrefix}Min`);
                        const maxInput = document.getElementById(`${inputPrefix}Max`);
                        if (minInput && maxInput) {
                            const tryMin = parseVolumeNumber(minInput.defaultValue || minInput.value);
                            const tryMax = parseVolumeNumber(maxInput.defaultValue || maxInput.value);
                            if (Number.isFinite(tryMin) && Number.isFinite(tryMax)) {
                                defaults = { min: Number(tryMin.toFixed(2)), max: Number(tryMax.toFixed(2)) };
                            }
                        }
                    }
                    if (!defaults) {
                        defaults = boundsFn(tab);
                    }
                    if (!defaults || !Number.isFinite(defaults.min) || !Number.isFinite(defaults.max)) {
                        defaults = { min: 0, max: 0 };
                    }
                    if (defaults.min > defaults.max) defaults.max = defaults.min;
                    filterState[tab][field] = { min: defaults.min, max: defaults.max };
                }
            });
            
            // Update UI
            buildFilterContent();
        }
        
        // Toggle between Select All and Clear All
        function toggleSelectClearAll() {
            const tab = currentTab;
            
            // Check if any filter has __NONE__ (meaning nothing selected)
            const hasNoneSelected = Object.keys(filterState[tab]).some(field => 
                filterState[tab][field] instanceof Set && filterState[tab][field].has('__NONE__')
            );
            
            // Check if all filters are empty (meaning all selected)
            const allEmpty = Object.keys(filterState[tab]).every(field => 
                filterState[tab][field] instanceof Set ? filterState[tab][field].size === 0 : true
            );
            
            if (hasNoneSelected || !allEmpty) {
                // If nothing selected or some items selected, select all
                selectAllFilters();
            } else {
                // If all selected, clear all
                clearFilters();
            }
        }

        // Apply filters
        function applyFilters() {
            closeFilterPopup();
            // Ensure volume inputs are parsed and stored before applying filters
            try {
                const tab = currentTab;
                const minInput = document.getElementById('filterVolumeMin');
                const maxInput = document.getElementById('filterVolumeMax');
                if (minInput && maxInput && filterState[tab]) {
                    const bounds = getVolumeBoundsForTab(tab);
                    let minValue = parseVolumeNumber(minInput.value);
                    let maxValue = parseVolumeNumber(maxInput.value);
                    if (!Number.isFinite(minValue)) minValue = bounds.min;
                    if (!Number.isFinite(maxValue)) maxValue = bounds.max;
                    if (minValue < bounds.min) minValue = bounds.min;
                    if (maxValue > bounds.max) maxValue = bounds.max;
                    if (minValue > maxValue) {
                        // adjust to keep valid
                        if (minValue === parseVolumeNumber(minInput.value)) {
                            minValue = maxValue;
                        } else {
                            maxValue = minValue;
                        }
                    }
                    filterState[tab].volume = { min: Number(minValue.toFixed(2)), max: Number(maxValue.toFixed(2)) };
                    updateFilterVolumeDescription(tab);
                }
            } catch (e) {
                console.warn('applyFilters: error parsing volume inputs', e);
            }

            // Trigger data refresh with filters
            if (currentTab === 'stock') {
                if (typeof fetchData === 'function') {
                    state.currentPage = 0;
                    fetchData();

            } else if (currentTab === 'high') {

                }
            } else if (currentTab === 'watchlist') {
