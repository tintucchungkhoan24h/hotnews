name: Update Sitemap

permissions:
  contents: write

on:
  schedule:
    # Run daily at 00:00 UTC (7:00 AM Vietnam time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          
      - name: Generate digest pages and update sitemap
        run: |
          node scripts/generate-digest.mjs
          node scripts/generate-digest-macro.mjs
          node scripts/generate-world-news.mjs
          node scripts/regenerate-sitemap.mjs
          node scripts/generate-news-sitemap.mjs
        
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add sitemap.xml news-sitemap.xml diem-tin-chung-khoan/ diem-tin-vi-mo/ world-news/
          git diff --staged --quiet || git commit -m "Auto-update sitemap and digest pages"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}

      # --- TỰ ĐỘNG KÍCH HOẠT GOOGLE INDEXING API ---
      - name: Create Service Account Key File
        run: |
          echo '${{ secrets.GCP_INDEXING_SERVICE_ACCOUNT_KEY }}' > service_account.json

      - name: Install Google APIs client and Ping Google
        run: |
          npm install googleapis
          node scripts/ping-google-index.mjs